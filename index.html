<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Immobilien-Cockpit · Specht</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Immobilien Cockpit">
<meta name="theme-color" content="#fcfcfb">
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --card:#ffffff; --border:#e6e4df; --border-strong:#d1cfc8;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8880;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#008300; --warn:#b97e00; --warn-bg:#fdf3dd; --bad:#c43837; --bad-bg:#fbeaea; --good-bg:#e8f3e8; --info-bg:#e9f1fb;
  --radius:10px; --shadow:0 1px 3px rgba(20,20,15,.07),0 1px 2px rgba(20,20,15,.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.45}
a{color:var(--s1)}
#app{display:flex;min-height:100vh}
nav{width:220px;flex-shrink:0;background:#f4f3f0;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:2px 6px 18px;letter-spacing:-.2px}
nav h1 small{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-top:2px}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;background:transparent;border-radius:8px;font-size:14px;color:var(--ink-2);cursor:pointer;font-family:inherit}
nav button:hover{background:#eceae5}
nav button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
nav .icon{width:20px;text-align:center;flex-shrink:0}
main{flex:1;padding:26px 32px;max-width:1160px;min-width:0}
h2{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--ink-2);margin:0 0 20px;font-size:13.5px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink-2);margin-bottom:3px}
.kpi .v{font-size:21px;font-weight:650;letter-spacing:-.4px}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border-strong)}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-good{background:var(--good-bg);color:var(--good)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--s1)}
.b-mut{background:#f0efec;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn:hover{background:#f6f5f2}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.primary:hover{background:#256abf}
.btn.small{padding:3px 9px;font-size:12px;border-radius:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.obj-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.obj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
.obj-card:hover{border-color:var(--s1)}
.obj-card h3{margin:0 0 2px;font-size:15px}
.obj-card .addr{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.obj-card .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-2)}
.obj-card .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.chart{margin-top:6px}
.chart .crow{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;margin:7px 0}
.chart .cl{font-size:12.5px;color:var(--ink-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart .bars{display:flex;flex-direction:column;gap:2px}
.chart .bar{height:13px;border-radius:0 4px 4px 0;min-width:2px;position:relative}
.chart .bar span{position:absolute;left:calc(100% + 6px);top:-1px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin:4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.alert{border-left:3px solid var(--bad);background:var(--bad-bg);padding:9px 34px 9px 12px;border-radius:0 8px 8px 0;margin:6px 0;font-size:13.5px;position:relative}
.alert .ax{position:absolute;right:6px;top:5px;border:0;background:none;color:inherit;opacity:.55;font-size:16px;font-weight:700;cursor:pointer;padding:2px 6px;line-height:1}
.alert .ax:hover{opacity:1}
.alert.warn{border-color:var(--warn);background:var(--warn-bg)}
.alert.info{border-color:var(--s1);background:var(--info-bg)}
.note{font-size:12.5px;color:var(--ink-2)}
.drop{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:44px;text-align:center;color:var(--ink-2);cursor:pointer;background:var(--card)}
.drop.over{border-color:var(--s1);background:var(--info-bg)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:block;margin:10px 0 4px}
.frow{display:flex;gap:12px}.frow>div{flex:1}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{padding:11px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.user{background:var(--s1);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg.ai h4{margin:8px 0 4px}
.chat-input{display:flex;gap:8px;margin-top:12px}
.chat-input textarea{flex:1;min-height:44px}
.pill-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill-tabs button{border:1px solid var(--border-strong);background:#fff;border-radius:99px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink-2)}
.pill-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
dialog{border:0;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(10,10,8,.35)}
.mut{color:var(--ink-3)}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.backlink{font-size:13px;margin-bottom:12px;display:inline-block;cursor:pointer;color:var(--s1)}
#mobHead{display:none}
#tabbar{display:none}
#moreSheet{display:none}
@media(max-width:840px){
html,body{overflow-x:hidden}
#app{flex-direction:column}
nav{display:none}
#mobHead{display:flex;align-items:baseline;gap:8px;position:sticky;top:0;z-index:60;background:rgba(244,243,240,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
#mobHead b{font-size:15.5px;letter-spacing:-.2px}
#mobHead span{font-size:11px;color:var(--ink-3)}
main{padding:14px 12px calc(84px + env(safe-area-inset-bottom));max-width:100%}
h2{font-size:19px}
.sub{margin-bottom:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{padding:10px 12px}.kpi .v{font-size:17px}
.card{padding:12px}
table{font-size:12.5px}
th,td{padding:6px}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.mcell{display:flex;justify-content:space-between;gap:12px;padding:4px 0;align-items:baseline;flex-wrap:wrap}
.mcell.mhead{display:block;border-bottom:1px solid var(--border);padding:0 0 7px;margin-bottom:5px}
.mcell.mhead .mlab{display:none}
.mcell.mhead .mval{text-align:left;font-size:14px}
.mlab{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:600;flex-shrink:0}
.mval{text-align:right;min-width:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mval input[type=number],.mval input[type=text]{max-width:130px}
.mval .btn{margin:2px 0 0 4px}
.chart .crow{grid-template-columns:104px 1fr}
.btn{padding:6px 10px;font-size:12.5px}
.frow{flex-wrap:wrap}
.obj-grid{grid-template-columns:1fr}
dialog{padding:14px;width:min(480px,94vw)}
.pill-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
#rcPaneE{grid-template-columns:1fr!important}
#tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(252,252,251,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;font-size:19px;line-height:1.2;color:var(--ink-3);font-family:inherit;padding:3px 0;cursor:pointer}
#tabbar button span{font-size:10px;font-weight:600;letter-spacing:.1px}
#tabbar button.active{color:var(--s1)}
#moreSheet.open{display:grid;position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:99;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.18);padding:10px;grid-template-columns:1fr 1fr;gap:7px}
#moreSheet button{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px 10px;font-size:13.5px;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left}
#moreSheet button.active{border-color:var(--s1);color:var(--s1);font-weight:600;background:var(--info-bg)}
}
@media print{nav{display:none}}
</style>

<body>
<div id="app">
<nav>
  <h1>Immobilien-Cockpit<small>Specht &amp; Waschkowski</small></h1>
  <button data-v="dash" class="active"><span class="icon">◫</span>Übersicht</button>
  <button data-v="objekte"><span class="icon">⌂</span>Objekte</button>
  <button data-v="bank"><span class="icon">€</span>Bank &amp; Zahlungen</button>

  <button data-v="verkauf"><span class="icon">🏷</span>Verkauf</button>
  <button data-v="vermoegen"><span class="icon">📈</span>Vermögensaufbau</button>
  <button data-v="nk"><span class="icon">🧾</span>Nebenkosten</button>
  <button data-v="erinner"><span class="icon">⏰</span>Erinnerungen</button>
  <button data-v="ki"><span class="icon">✦</span>KI-Fragen</button>
  <button data-v="rechner"><span class="icon">🧮</span>Immobilien-Rechner</button>
  <button data-v="conf"><span class="icon">⚙</span>Einstellungen</button>
</nav>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<header id="mobHead"><b>Immobilien-Cockpit</b><span>Specht &amp; Waschkowski</span></header>
<main id="main"></main>
</div>
</div>
<div id="moreSheet">
  <button data-v="miet"><span class="icon">↗</span>Mietspiegel-Check</button>
  <button data-v="verkauf"><span class="icon">🏷</span>Verkauf</button>
  <button data-v="vermoegen"><span class="icon">📈</span>Vermögensaufbau</button>
  <button data-v="nk"><span class="icon">🧾</span>Nebenkosten</button>
  <button data-v="ki"><span class="icon">✦</span>KI-Fragen</button>
  <button data-v="rechner"><span class="icon">🧮</span>Immobilien-Rechner</button>
  <button data-v="conf"><span class="icon">⚙</span>Einstellungen</button>
</div>
<div id="tabbar">
  <button data-v="dash" class="active">◫<span>Übersicht</span></button>
  <button data-v="objekte">⌂<span>Objekte</span></button>
  <button data-v="bank">€<span>Bank</span></button>
  <button data-v="erinner">⏰<span>Termine</span></button>
  <button id="tbMore" type="button">☰<span>Mehr</span></button>
</div>
<script>
/* ========== Storage (mit Fallback, falls localStorage nicht verfügbar) ========== */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return mem[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let DATA = store.get('ic_data');
let SETTINGS = store.get('ic_settings') || {apiKey:'', model:'claude-sonnet-4-5'};
let ASSIGN = store.get('ic_assign') || {};      // iban/name-hash -> einheitId (manuelle Zuordnungen)
let PAYMENTS = store.get('ic_payments') || [];   // importierte Umsätze

/* ========== Helpers ========== */
const EUR = n => n==null ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
const EUR2 = n => n==null ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const QM = n => n==null ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €/m²';
const D = s => s ? new Date(s+ (s.length===7?'-01':'')).toLocaleDateString('de-DE',{day:s.length>7?'2-digit':undefined,month:'2-digit',year:'numeric'}) : '–';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9äöüß ]/g,' ').replace(/\s+/g,' ').trim();
const today = () => new Date();
function addMonths(d, m){ const x=new Date(d); x.setMonth(x.getMonth()+m); return x; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function allUnits(){ const u=[]; (DATA?.objekte||[]).forEach(o=>o.einheiten.forEach(e=>u.push({o,e}))); return u; }
function unitById(id){ return allUnits().find(x=>x.e.id===id); }
function warm(e){ return (e.kaltmiete||0)+(e.nk||0)+(e.hk||0)+(e.ust||0); }
function mietspiegelOf(ort){ return (DATA?.mietspiegel||[]).find(m=>m.ort===ort); }

/* ========== Mietspiegel- & Erhöhungslogik (§558/§557b BGB, vereinfacht) ========== */
function mietCheck(o, e){
  const ms = mietspiegelOf(o.ort);
  const r = {qm:null, status:'unbekannt', ampel:'mut', text:'', potenzial:0, naechsteErhoehung:null, hinweis:[]};
  if(e.flaeche && e.kaltmiete){ r.qm = e.kaltmiete/e.flaeche; }
  if(e.gewerbe || e.mietart==='gewerbe'){
    r.status='Gewerbe'; r.ampel='mut'; r.text='Gewerbemiete – Erhöhung nur nach Vertrag (Staffel/Index/Option).';
    return r;
  }
  if(!ms || r.qm==null){ r.text='Keine Vergleichsdaten.'; return r; }
  const [lo,hi]=ms.spanne;
  if(r.qm < lo){ r.status='deutlich unter Markt'; r.ampel='bad'; }
  else if(r.qm < ms.wert){ r.status='unter Vergleichsmiete'; r.ampel='warn'; }
  else if(r.qm <= hi){ r.status='marktgerecht'; r.ampel='good'; }
  else { r.status='über Marktspanne'; r.ampel='info'; }
  // Wartefrist §558: neues Erhöhungsverlangen frühestens 12 Monate nach letzter Erhöhung, wirksam +3 Monate = 15 Monate
  const basisDatum = e.letzte_erhoehung ? new Date(e.letzte_erhoehung.datum) : (e.mietbeginn?new Date(e.mietbeginn):null);
  if(e.mietart==='index'){
    r.hinweis.push('Indexmietvertrag (§557b): Anpassung gemäß VPI, frühestens 12 Monate nach letzter Anpassung; §558/Mietspiegel nicht anwendbar.');
    r.naechsteErhoehung = basisDatum ? addMonths(basisDatum,12) : null;
  } else {
    r.naechsteErhoehung = basisDatum ? addMonths(basisDatum,15) : null;
    // Kappungsgrenze: max +kappung% in 3 Jahren (vereinfachte Basis: Miete vor letzter Erhöhung, falls <3 Jahre her, sonst aktuelle Miete)
    const kapp = (ms.kappung||20)/100;
    let basisMiete = e.kaltmiete;
    if(e.letzte_erhoehung && (today()-new Date(e.letzte_erhoehung.datum)) < 3*365.25*864e5){ basisMiete = e.letzte_erhoehung.alt; }
    const maxKappung = basisMiete*(1+kapp);
    const ziel = Math.min(ms.wert*e.flaeche, maxKappung);
    r.potenzial = Math.max(0, Math.round(ziel - e.kaltmiete));
    if(r.potenzial>0){
      r.hinweis.push(`Bis Vergleichsmiete (${QM(ms.wert)}) und Kappungsgrenze (${ms.kappung} %/3 J.) sind ca. +${EUR(r.potenzial)}/Monat möglich.`);
    }
    if(ziel===maxKappung && ms.wert*e.flaeche>maxKappung) r.hinweis.push('Kappungsgrenze limitiert – volle Vergleichsmiete erst in mehreren Schritten erreichbar.');
  }
  if(e.besonderheiten && /verzicht/i.test(e.besonderheiten)) r.hinweis.push('Achtung: vertraglicher Erhöhungsverzicht – siehe Besonderheiten.');
  const fr = r.naechsteErhoehung;
  r.text = `${r.status}. ${fr ? (fr<=today() ? 'Erhöhung ab sofort möglich.' : 'Nächste Erhöhung wirksam ab '+fr.toLocaleDateString('de-DE')+'.') : ''}`;
  return r;
}

/* ========== Automatische Erinnerungsvorschläge ========== */
function autoReminders(){
  const list=[];
  const t=today();
  allUnits().forEach(({o,e})=>{
    const c = mietCheck(o,e);
    if(!e.gewerbe && c.potenzial>50 && c.naechsteErhoehung){
      const d = c.naechsteErhoehung<t ? addMonths(t,0) : c.naechsteErhoehung;
      list.push({titel:`Mieterhöhung prüfen: ${e.bezeichnung} (${e.mieter||'–'})`, datum:isoDate(addMonths(d,-2)), notiz:`${o.name} – Potenzial ca. +${c.potenzial} €/Monat. Wirksam frühestens ${d.toLocaleDateString('de-DE')}. Quelle Mietspiegel: ${mietspiegelOf(o.ort)?.quelle||''}`, kat:'Mieterhöhung'});
    }
    if(e.mietart==='index'){
      const basis = e.letzte_erhoehung? new Date(e.letzte_erhoehung.datum) : (e.mietbeginn?new Date(e.mietbeginn):null);
      if(basis) list.push({titel:`Indexanpassung prüfen: ${e.bezeichnung}`, datum:isoDate(addMonths(basis,12)), notiz:`${o.name} – VPI-Entwicklung seit ${basis.toLocaleDateString('de-DE')} prüfen (§557b).`, kat:'Indexmiete'});
    }
  });
  (DATA?.objekte||[]).forEach(o=>{
    if(o.finanzierung?.zinsbindung_ende){
      list.push({titel:`Anschlussfinanzierung: ${o.name}`, datum:isoDate(addMonths(new Date(o.finanzierung.zinsbindung_ende),-12)), notiz:`Zinsbindung endet am ${D(o.finanzierung.zinsbindung_ende)} (${o.finanzierung.bank||''}). 12 Monate vorher Konditionen vergleichen.`, kat:'Finanzierung'});
    }
  });
  // Betriebskostenabrechnung: Frist 31.12. für Vorjahr
  const jahr = t.getFullYear();
  list.push({titel:`Betriebskostenabrechnungen ${jahr-1} versenden (Frist 31.12.${jahr})`, datum:`${jahr}-10-01`, notiz:'Abrechnungsfrist §556 Abs. 3 BGB: 12 Monate nach Ende des Abrechnungszeitraums.', kat:'Nebenkosten'});

/* ========== ICS-Erstellung ========== */
function makeICS(titel, datum, notiz){
  const dt = datum.replace(/-/g,'');
  const uid = 'ic-'+Math.abs([...titel+datum].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))+'@immobilien-cockpit';
  const escT = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Immobilien-Cockpit//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+uid,'DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+escT(titel),'DESCRIPTION:'+escT(notiz),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+escT(titel),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function downloadICS(titel, datum, notiz){
  const blob = new Blob([makeICS(titel,datum,notiz)],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=titel.replace(/[^\wäöüß -]/gi,'').slice(0,60)+'.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function monatName(ym){ const [y,m]=ym.split('-'); return MONATE[+m-1]+' '+y; }
function anredeFor(mieter){
  if(!mieter) return 'Sehr geehrte Damen und Herren,';
  const m=mieter.replace(/\(.*?\)/g,'');
  if(/&|und| u\. /.test(m) || /familie/i.test(m)) return 'Sehr geehrte Mieterinnen und Mieter,';
  if(/^frau|^fr\./i.test(m.trim())) return 'Sehr geehrte '+m.trim()+',';
  return 'Sehr geehrte/r '+m.trim()+',';
}
function absenderFor(o){
  return /eGbR|GbR/i.test(o.eigentuemer||'') ? (o.eigentuemer.replace(/ \(.*\)/,'')) : 'Christian Specht';

function endeMonatPlus(n){ const t=today(); return new Date(t.getFullYear(), t.getMonth()+n+1, 0); }
function ersterMonatPlus(n){ const t=today(); return new Date(t.getFullYear(), t.getMonth()+n, 1); }

function offeneMonate(o,e){
  const perOf=p=>p.monat||p.datum?.slice(0,7);
  const credits=PAYMENTS.filter(p=>p.betrag>0||p.manual);
  const months=[...new Set(credits.map(perOf).filter(Boolean))].sort();
  const beginn=e.mietbeginn?e.mietbeginn.slice(0,7):null;
  const soll=warm(e);
  // Erster Monat, in dem für diese Einheit eine Zahlung erkannt wurde: frühere Monate liegen
  // i.d.R. vor dem Exportfenster des Kontoauszugs und werden nicht als offen gewertet.
  const paidMonths=months.filter(m=>credits.some(p=>perOf(p)===m && matchPayment(p)===e.id));
  const firstPaid=paidMonths[0]||null;
  const out=[];
  for(const m of months){
    if(beginn && m<beginn) continue;
    if(firstPaid && m<firstPaid) continue;
    const ist=credits.filter(p=>perOf(p)===m && matchPayment(p)===e.id).reduce((s,p)=>s+p.betrag,0);
    // Toleranz 5 Cent (Rundungsdifferenzen, z.B. USt-Beträge)
    if(ist+0.05<soll) out.push({monat:m, soll, ist, offen:Math.round((soll-ist)*100)/100});
  }
  return out;
}

  const eskalation = gesamt >= 2*warm(e)-1 ?
`\n\nWir weisen darauf hin, dass Sie sich mit den genannten Beträgen in Zahlungsverzug befinden (§ 286 BGB). Bei einem Rückstand in Höhe von zwei Monatsmieten sind wir berechtigt, das Mietverhältnis fristlos zu kündigen (§ 543 Abs. 2 Nr. 3 BGB). Wir möchten diesen Schritt vermeiden – bitte nehmen Sie bei Zahlungsschwierigkeiten kurzfristig Kontakt mit uns auf.` :
(off.length>1?`\n\nSie befinden sich mit den genannten Beträgen in Zahlungsverzug (§ 286 BGB). Bitte gleichen Sie den Rückstand zeitnah aus.`:'');
  return `${absenderFor(o)}\n\n${e.mieter||'[Mieter]'}\n${o.adresse} – ${e.bezeichnung}\n\nZahlungserinnerung – Miete ${off.length===1?monatName(off[0].monat):'(mehrere Monate)'} – ${e.bezeichnung}, ${o.adresse}\n\n${anredeFor(e.mieter)}\n\nbei der Durchsicht unserer Kontoeingänge haben wir festgestellt, dass für die von Ihnen gemietete Einheit folgende Mietzahlungen noch nicht bzw. nicht vollständig eingegangen sind:\n\n${liste||'- [keine offenen Monate in den importierten Umsätzen gefunden – bitte prüfen]'}\n\nOffener Gesamtbetrag: ${EUR2(gesamt)}\n\nBitte überweisen Sie den offenen Betrag bis zum ${DFMT(frist)} auf folgendes Konto:\n\nKontoinhaber: ${konto?konto.name.split('–')[0].trim():absenderFor(o)}\nIBAN: ${ibanFmt}${konto?`\nBank: ${konto.bank}`:''}\nVerwendungszweck: Miete ${e.bezeichnung}, ${off.map(x=>monatName(x.monat)).join(' + ')}\n\nSollte sich Ihre Zahlung mit diesem Schreiben überschnitten haben, betrachten Sie es bitte als gegenstandslos.${eskalation}\n\nMit freundlichen Grüßen\n${absenderFor(o)}`;
}
function zahlungsStatus(o,e){
  if(!e.mieter || !PAYMENTS.some(p=>p.betrag>0)) return {kind:'nodata'};
  const off=offeneMonate(o,e);
  if(!off.length) return {kind:'paid'};
  const anyObj=o.einheiten.some(u=>PAYMENTS.some(p=>p.betrag>0 && matchPayment(p)===u.id));
  if(!anyObj) return {kind:'noacct'};
  return {kind:'open', off, sum:Math.round(off.reduce((s,x)=>s+x.offen,0)*100)/100, seit:off[0].monat};
}
function zahlungsZelle(o,e){
  const z=zahlungsStatus(o,e);

  const teil=z.off.some(x=>x.ist>0);

}

let VIEW='dash', DETAIL=null;
function syncActive(){
  const more=['miet','verkauf','vermoegen','nk','ki','rechner','conf'];
  document.querySelectorAll('nav button[data-v],#tabbar button[data-v],#moreSheet button[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===VIEW));
  const mb=document.getElementById('tbMore'); if(mb) mb.classList.toggle('active',more.includes(VIEW));
}
document.querySelectorAll('nav button[data-v],#tabbar button[data-v],#moreSheet button[data-v]').forEach(b=>b.addEventListener('click',()=>{
  VIEW=b.dataset.v; DETAIL=null;
  const ms=document.getElementById('moreSheet'); if(ms) ms.classList.remove('open');
  render(); window.scrollTo(0,0);
}));
(function(){
  const tb=document.getElementById('tbMore'), ms=document.getElementById('moreSheet');
  if(tb&&ms){
    tb.addEventListener('click',()=>ms.classList.toggle('open'));
    document.addEventListener('click',e=>{
      if(ms.classList.contains('open')&&!ms.contains(e.target)&&!e.target.closest('#tbMore')) ms.classList.remove('open');
    });
  }
})();
function render(){
  const m=document.getElementById('main');
  if(!DATA&&VIEW!=='conf'){ m.innerHTML=viewNoData(); wireNoData(); syncActive(); return; }
  if(VIEW==='dash') m.innerHTML=viewDash();
  else if(VIEW==='objekte'){ m.innerHTML=DETAIL?viewObjektDetail(DETAIL):viewObjekte(); if(!DETAIL){ wireObjSort(); if(typeof wireObjNeu==='function') wireObjNeu(); } }
  else if(VIEW==='bank'){ m.innerHTML=viewBank(); wireBank(); }
  else if(VIEW==='miet') m.innerHTML=viewMiet();
  else if(VIEW==='verkauf'){ m.innerHTML=viewVerkauf(); wireVerkauf(); }
  else if(VIEW==='vermoegen'){ m.innerHTML=viewVermoegen(); wireVermoegen(); }
  else if(VIEW==='nk'){ m.innerHTML=viewNK(); wireNK(); }
  else if(VIEW==='rechner'){ m.innerHTML=viewRechner(); wireRechner(); }
  else if(VIEW==='erinner'){ m.innerHTML=viewErinner(); wireErinner(); }
  else if(VIEW==='ki'){ m.innerHTML=viewKI(); wireKI(); }
  else if(VIEW==='conf'){ m.innerHTML=viewConf(); wireConf(); }
  m.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();DETAIL=el.dataset.open;VIEW='objekte';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.v==='objekte'));render();}));
  m.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',()=>{DETAIL=null;render();}));
  m.querySelectorAll('[data-ics]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();icsDialog(JSON.parse(el.dataset.ics));}));
  m.querySelectorAll('[data-icsdirect]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();const p=JSON.parse(el.dataset.icsdirect);downloadICS(p.titel,p.datum,p.notiz);}));
  m.querySelectorAll('[data-pay]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();openPayDialog(el.dataset.pay);}));
  m.querySelectorAll('[data-objedit]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();openObjEdit(el.dataset.objedit);}));
  m.querySelectorAll('[data-brief]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const b=JSON.parse(el.dataset.brief);
    const u=unitById(b.id); if(!u) return;
    if(b.kind==='erh') textDialog('Mieterhöhung: '+u.e.bezeichnung, briefErhoehung(u.o,u.e));
    else textDialog('Zahlungserinnerung: '+u.e.bezeichnung, briefMahnung(u.o,u.e));
  }));
  m.querySelectorAll('[data-open-view]').forEach(el=>el.addEventListener('click',()=>{VIEW=el.dataset.openView;DETAIL=null;render();window.scrollTo(0,0);}));
  m.querySelectorAll('[data-alertoff]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const d=store.get('ic_alerts_off')||[];
    if(!d.includes(el.dataset.alertoff)) d.push(el.dataset.alertoff);
    store.set('ic_alerts_off',d); render();
  }));
  m.querySelectorAll('[data-alertreset]').forEach(el=>el.addEventListener('click',()=>{ store.set('ic_alerts_off',[]); render(); }));
  // Mobil: Tabellen zu gestapelten Karten umbauen (kein horizontales Scrollen)
  if(window.innerWidth<=840) mobileTables(m);
  // Desktop-Fallback: Tabellen scrollbar einpacken
  m.querySelectorAll('table').forEach(t=>{
    const p=t.parentElement;
    if(p&&(p.classList.contains('twrap')||/overflow/.test(p.getAttribute('style')||''))) return;
    const w=document.createElement('div'); w.className='twrap'; t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
  syncActive();
}
/* Tabellen → Karten-Liste (mobil). Verschiebt die Original-Zellinhalte, Event-Listener bleiben erhalten. */
function mobileTables(root){
  root.querySelectorAll('table').forEach(t=>{
    const ths=[...t.querySelectorAll('thead th')].map(h=>h.textContent.replace(/\s+/g,' ').trim());
    if(!ths.length) return;
    const list=document.createElement('div'); list.className='mlist';
    [...t.querySelectorAll('tbody tr')].forEach(tr=>{
      const card=document.createElement('div'); card.className='mrow';
      const cells=[...tr.children];
      cells.forEach((td,i)=>{
        const hasContent=td.textContent.trim()||td.querySelector('input,button,select,a,span,div');
        if(!hasContent) return;
        const cell=document.createElement('div'); cell.className='mcell'+(i===0?' mhead':'');
        const lab=document.createElement('div'); lab.className='mlab'; lab.textContent=cells.length===1?'':(ths[i]||'');
        const val=document.createElement('div'); val.className='mval';
        while(td.firstChild) val.appendChild(td.firstChild);
        cell.appendChild(lab); cell.appendChild(val); card.appendChild(cell);
      });
      if(card.children.length) list.appendChild(card);
    });
    t.replaceWith(list);
  });
}

/* ========== Daten laden ========== */
function viewNoData(){
  return `<h2>Willkommen im Immobilien-Cockpit</h2>
  <p class="sub">Es sind noch keine Daten geladen. Zwei Wege:</p>
  <div class="card"><h3>Empfohlen: Synchronisation</h3>
  <p class="note">Wenn auf einem anderen Gerät schon Daten liegen: einmal Token + Sync-Passwort hinterlegen, der Rest kommt automatisch.</p>
  <div class="btnrow"><button class="btn primary" id="ndConf">Zu den Einstellungen</button></div></div>
  <div class="card"><h3>Oder: Datendatei laden</h3>
  <div class="drop" id="drop">Datei <b>immobilien-daten.json</b> hierher ziehen<br>oder klicken/tippen zum Auswählen
  <input type="file" id="fileIn" accept=".json" style="display:none"></div></div>
  <p class="note" style="margin-top:14px">Die Daten bleiben im Browser dieses Geräts (bzw. verschlüsselt im Sync) – nie öffentlich lesbar auf GitHub.</p>`;
}
function wireNoData(){
  const drop=document.getElementById('drop'), fi=document.getElementById('fileIn');
  drop.addEventListener('click',()=>fi.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');loadDataFile(e.dataTransfer.files[0]);});
  fi.addEventListener('change',()=>loadDataFile(fi.files[0]));
  const nc=document.getElementById('ndConf');
  if(nc) nc.addEventListener('click',()=>{VIEW='conf';render();});
}
function loadDataFile(f){
  if(!f) return;
  f.text().then(t=>{
    try{ const j=JSON.parse(t); if(!j.objekte) throw 0; DATA=j; store.set('ic_data',j); render(); }
    catch(e){ alert('Datei konnte nicht gelesen werden – ist es die richtige immobilien-daten.json?'); }
  });
}

/* ========== Objekte ========== */
const MON_KURZ=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function objektZahlungen(o){
  if(!PAYMENTS.some(p=>p.betrag>0)) return null;
  const units=o.einheiten.filter(e=>e.mieter);
  if(!units.length) return null;
  const anyObj=units.some(e=>PAYMENTS.some(p=>p.betrag>0 && matchPayment(p)===e.id));
  if(!anyObj) return {noacct:true};
  const perOf=p=>p.monat||p.datum?.slice(0,7);
  const allMonths=[...new Set(PAYMENTS.filter(p=>p.betrag>0).map(perOf).filter(Boolean))].sort();
  const last3=allMonths.slice(-3);
  const perUnit=units.map(e=>offeneMonate(o,e));
  const kum=Math.round(perUnit.flat().reduce((s,x)=>s+x.offen,0)*100)/100;
  const byMonth=last3.map(m=>{
    let sum=0,teil=0,offen=0;
    perUnit.forEach(off=>{ const x=off.find(y=>y.monat===m); if(x){ sum+=x.offen; if(x.ist>0) teil++; else offen++; } });
    return {m, sum:Math.round(sum*100)/100, offen, teil};
  });
  return {byMonth, kum};
}
function monatsChips(z){
  if(!z) return '<span class="mut">keine Umsätze importiert</span>';
  if(z.noacct) return '<span class="badge b-mut">Konto nicht importiert</span>';
  return z.byMonth.map(x=>{
    const kurz=MON_KURZ[+x.m.slice(5)-1];
    if(x.sum<=0.005) return `<span class="badge b-good" title="${kurz}: alle Mieten eingegangen">${kurz} ✓</span>`;
    const n=x.offen+x.teil;
    return `<span class="badge b-${x.offen?'bad':'warn'}" title="${kurz}: ${EUR2(x.sum)} offen (${x.offen} offen, ${x.teil} Teilzahlung)">${kurz} ${n}✗</span>`;
  }).join(' ');
}
function svUrl(o){ return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${o.lat},${o.lon}`; }
function mapUrl(o){ return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.adresse)}`; }

function wireObjSort(){
  const grid=document.getElementById('objGrid'); if(!grid) return;
  let dragId=null;
  grid.querySelectorAll('[data-drag]').forEach(card=>{
    card.addEventListener('dragstart',e=>{ dragId=card.dataset.drag; card.style.opacity='.4'; e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>{ card.style.opacity=''; });
    card.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; card.style.borderColor='var(--s1)'; });
    card.addEventListener('dragleave',()=>{ card.style.borderColor=''; });
    card.addEventListener('drop',e=>{
      e.preventDefault(); card.style.borderColor='';
      const targetId=card.dataset.drag;
      if(!dragId||dragId===targetId) return;
      const order=orderedObjekte().map(o=>o.id);
      const from=order.indexOf(dragId), to=order.indexOf(targetId);
      order.splice(from,1); order.splice(to,0,dragId);
      store.set('ic_order',order); render();
    });
  });
}

function importBankFile(f){
  if(!f) return;
  f.arrayBuffer().then(buf=>{
    let text = new TextDecoder('utf-8',{fatal:false}).decode(buf);
    if(text.includes('�')) text = new TextDecoder('windows-1252').decode(buf);
    let items=[];
    if(/^\s*<\?xml|<Document/i.test(text)) items = parseCAMT(text);
    else items = parseCSV(text);
    if(!items.length){ window._bankMsg='⚠︎ Keine Umsätze in "'+f.name+'" erkannt. Bitte CSV-Export des Online-Bankings oder CAMT.053-XML verwenden.'; render(); return; }
    const known=new Set(PAYMENTS.map(p=>p.key));
    let added=0;
    items.forEach(p=>{ if(!known.has(p.key)){ PAYMENTS.push(p); added++; } });
    store.set('ic_payments',PAYMENTS);
    window._bankMonth=null;
    window._bankMsg='✓ '+added+' neue Umsätze aus "'+f.name+'" importiert ('+(items.length-added)+' Duplikate übersprungen).';
    render();
  });
}
function payKey(p){ return [p.datum,p.betrag,norm(p.name).slice(0,20),norm(p.zweck).slice(0,30)].join('|'); }
/* Miet-Monat aus dem Verwendungszweck ableiten ("Miete Juli", "07/2026"), sonst Buchungsmonat.
   Nur akzeptieren, wenn der erkannte Monat max. 2 Monate vom Buchungsdatum abweicht (schützt vor alten Dauerauftragstexten). */
function detectPeriod(zweck, datum){
  const fallback=datum.slice(0,7);
  const MON={januar:1,februar:2,maerz:3,'märz':3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};
  const base=new Date(datum); const by=base.getFullYear(), bm=base.getMonth()+1;
  const z=norm(zweck||'');
  let m=null,y=null,pos=1e9;
  for(const name in MON){
    const i=z.indexOf(name);
    if(i>=0 && i<pos){ pos=i; m=MON[name]; const ym=z.match(new RegExp(name+'\\s*(20\\d{2})')); y=ym?+ym[1]:null; }
  }
  if(m==null){
    // nur echtes "MM/JJ(JJ)" mit Schrägstrich im Original-Zweck (nicht normalisiert, sonst wird "8,90 EUR" zu "8 90")
    const mm=String(zweck||'').toLowerCase().match(/(?:^|[^0-9])(0?[1-9]|1[0-2])\s*\/\s*(20\d{2}|\d{2})(?:[^0-9]|$)/);
    if(mm){ m=+mm[1]; y=mm[2].length===4?+mm[2]:2000+ +mm[2]; if(y<2020||y>2040) y=null; }
  }
  if(m==null) return fallback;
  const probe=cands=>{
    let best=null,bd=99;
    for(const cy of cands){ const diff=Math.abs((cy*12+m)-(by*12+bm)); if(diff<bd){bd=diff;best=cy;} }
    return bd<=2?best:null;
  };
  // Erst explizites Jahr versuchen; wenn unplausibel (z.B. Tippfehler "5/25" statt "5/26"), Jahr rund ums Buchungsdatum probieren
  let best=y!=null?probe([y]):null;
  if(best==null) best=probe([by-1,by,by+1]);
  if(best==null) return fallback;
  return best+'-'+String(m).padStart(2,'0');
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const delim=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===delim&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;};
  const trans = s => norm(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  const head=split(lines[0]).map(h=>trans(h));
  // Schlüssel in Prioritätsreihenfolge suchen: Pass 0 = exakter Spaltenname, Pass 1 = enthält; exclude verhindert Fehltreffer
  const findCol=(keys,exclude)=>{
    for(const pass of [0,1]){
      for(const k of keys){
        const i=head.findIndex(h=>(pass===0?h===k:h.includes(k))&&!(exclude||[]).some(x=>h.includes(x)));
        if(i>=0) return i;
      }
    }
    return -1;
  };
  const ci={
    datum: findCol(['buchungstag','buchungsdatum','valutadatum','wertstellung','datum']),
    name: findCol(['sender','name zahlungsbeteiligter','beguenstigter zahlungspflichtiger','beguenstigter','zahlungspflichtiger','auftraggeber','name']),
    name2: findCol(['empfaenger']),
    iban: findCol(['iban zahlungsbeteiligter','iban auftraggeberkonto','kontonummer iban','iban'],['kontoinhaber']),
    zweck: findCol(['verwendungszweck','buchungstext','umsatztext']),
    betrag: findCol(['betrag','umsatz in eur','umsatz'],['umsatzart'])
  };
  if(ci.datum<0||ci.betrag<0) return [];
  const out=[];
  for(let i=1;i<lines.length;i++){
    const c=split(lines[i]); if(c.length<3) continue;
    const rawD=(c[ci.datum]||'').trim();
    let dm=rawD.match(/(\d{2})\.(\d{2})\.(\d{2,4})/);
    let datum=null;
    if(dm){ let y=dm[3].length===2?'20'+dm[3]:dm[3]; datum=`${y}-${dm[2]}-${dm[1]}`; }
    else { dm=rawD.match(/(\d{4})-(\d{2})-(\d{2})/); if(dm) datum=dm[0]; }
    if(!datum) continue;
    let b=(c[ci.betrag]||'').replace(/\s|€/g,'');
    if(/,\d{1,2}$/.test(b)) b=b.replace(/\./g,'').replace(',','.');
    const betrag=parseFloat(b);
    if(isNaN(betrag)) continue;
    const name=((c[ci.name]||'').trim()) || ((ci.name2>=0?c[ci.name2]:'')||'').trim();
    const p={datum, betrag, name, iban:(ci.iban>=0?(c[ci.iban]||''):'').replace(/\s/g,'').toUpperCase(), zweck:(c[ci.zweck]||'').trim()};
    p.monat=detectPeriod(p.zweck, datum);
    p.key=payKey(p); out.push(p);
  }
  return out;
}
function parseCAMT(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const out=[];
  doc.querySelectorAll('Ntry').forEach(n=>{
    const g=s=>n.querySelector(s)?.textContent?.trim()||'';
    const cdt = g('CdtDbtInd')==='CRDT';
    const amt = parseFloat(g('Amt'));
    const datum = g('BookgDt Dt')||g('ValDt Dt');
    const dtl = n.querySelector('NtryDtls TxDtls');
    const gd = s=>dtl?.querySelector(s)?.textContent?.trim()||'';
    const p={datum, betrag: cdt?amt:-amt, name: gd('RltdPties Dbtr Nm')||gd('Dbtr Nm'), iban: (gd('DbtrAcct Id IBAN')||'').toUpperCase(), zweck: [...(dtl?.querySelectorAll('RmtInf Ustrd')||[])].map(x=>x.textContent).join(' ')};
    if(p.datum && !isNaN(p.betrag)){ p.monat=detectPeriod(p.zweck, p.datum); p.key=payKey(p); out.push(p); }
  });
  return out;
}
function matchPayment(p){
  if(ASSIGN['key:'+p.key]) return ASSIGN['key:'+p.key];
  if(p.iban && ASSIGN['iban:'+p.iban]) return ASSIGN['iban:'+p.iban];
  if(p.name && ASSIGN['name:'+norm(p.name)]) return ASSIGN['name:'+norm(p.name)];
  const units=allUnits();
  // Eigene Überträge (Specht/Waschkowski-Konten) nie automatisch als Miete zuordnen
  if(/specht|waschkowski/i.test(p.name||'')) return null;
  // 1) IBAN aus Stammdaten
  if(p.iban){ const hit=units.find(({e})=>e.iban && e.iban.replace(/\s/g,'')===p.iban); if(hit) return hit.e.id; }
  // 2) Nachname des Mieters in Absendername oder Verwendungszweck (keine reinen Zahlen-Tokens wie Jahreszahlen)
  const hayTokens=new Set(norm(p.name+' '+p.zweck).split(' '));
  const stop=['familie','herr','frau','miete','mieter'];
  let best=null, bestScore=0, tie=false;
  for(const {e} of units){
    if(!e.mieter) continue;
    const tokens=norm(e.mieter).split(' ').filter(t=>t.length>3 && !/^\d+$/.test(t) && !stop.includes(t));
    const score=tokens.filter(t=>hayTokens.has(t)).length;
    if(score>0){
      if(score>bestScore){ best=e.id; bestScore=score; tie=false; }
      else if(score===bestScore && best!==e.id){ tie=true; }
    }
  }
  if(best && !tie) return best;
  if(best && tie) return null;
  // 3) exakter Warmmieten-Betrag (eindeutig) – nur wenn der Zweck nach Miete aussieht
  if(/miete|kaltmiete|warmmiete|nk|pacht/i.test(p.zweck||'')){
    const amountHits=units.filter(({e})=>Math.abs(warm(e)-p.betrag)<0.01);
    if(amountHits.length===1) return amountHits[0].e.id;
  }
  return null;
}

function slugify(s){ return String(s||'').toLowerCase().replace(/[äöüß]/g,m=>({ä:'ae',ö:'oe',ü:'ue',ß:'ss'}[m])).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'objekt'; }
async function objExtractFile(file){
  const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
  const isImg=/\.(jpe?g|png|webp)$/i.test(file.name);
  if(!isPdf&&!isImg) return {skip:'kein PDF/Bild'};
  if(file.size>15*1024*1024) return {skip:'>15 MB'};
  if(file.size<200) return {skip:'leer (iCloud nicht geladen?)'};
  const b64d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
  const content=[
    isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64d}}
         :{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64d}},
    {type:'text',text:'Analysiere dieses Immobilien-Dokument. Antworte NUR mit einem JSON-Objekt ohne Erklärtext. Gib ausschließlich Felder aus, die im Dokument wirklich stehen (alles andere weglassen): {"dok":"kaufvertrag|mietvertrag|darlehensvertrag|expose|sonstiges","objekt":{"name":"Kurzname z.B. Straße Hausnr, Ort","strasse":"Straße Hausnr","plz":"","ort":"","typ":"z.B. MFH 6 Wohnungen / ETW / Reihenhaus"},"kaufpreis":Zahl,"kaufdatum":"YYYY-MM-DD (Datum des notariellen Kaufvertrags)","finanzierung":{"bank":"","darlehen":Zahl,"zins":Zahl in Prozent,"tilgung":Zahl in Prozent,"rate":monatliche Rate als Zahl,"zinsbindung_ende":"YYYY-MM-DD"},"einheit":{"bezeichnung":"z.B. EG links","mieter":"Name(n)","flaeche":Zahl qm,"kaltmiete":Zahl,"nk":NK-Vorauszahlung Zahl,"hk":Heizkosten-Vorauszahlung Zahl,"mietbeginn":"YYYY-MM-DD","index":true falls Indexmietvertrag},"iban":"IBAN des Mietkontos falls genannt"}'}
  ];
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
    'content-type':'application/json','x-api-key':SETTINGS.apiKey,
    'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'
  },body:JSON.stringify({model:SETTINGS.model||'claude-sonnet-4-5',max_tokens:600,messages:[{role:'user',content}]})});
  const j=await resp.json();
  if(j.error) throw new Error(j.error.message||'API-Fehler');
  const m=(j.content.map(x=>x.text||'').join('')).match(/\{[\s\S]*\}/);
  if(!m) throw new Error('keine auswertbare Antwort');
  return JSON.parse(m[0]);
}
async function objNeuUpload(files){
  const prog=document.getElementById('onProg');
  if(!SETTINGS.apiKey){ prog.innerHTML='<b style="color:var(--bad)">Kein API-Key hinterlegt</b> – unter Einstellungen → Claude API eintragen.'; return; }
  const list=[...files].filter(f=>!f.name.startsWith('.'));
  if(!list.length){ prog.textContent='Keine Dateien gewählt.'; return; }
  const lines=[]; const show=()=>{prog.innerHTML=lines.join('<br>');};
  const draft={objekt:{},kauf:{},fin:{},einheiten:[],iban:'',quellen:[]};
  for(const f of list){
    lines.push('⏳ '+esc(f.name)); show();
    try{
      const r=await objExtractFile(f);
      if(r.skip){ lines[lines.length-1]='– '+esc(f.name)+' <span class="mut">'+esc(r.skip)+'</span>'; show(); continue; }
      if(r.objekt){ ['name','strasse','plz','ort','typ'].forEach(k=>{ if(r.objekt[k]&&!draft.objekt[k]) draft.objekt[k]=r.objekt[k]; }); }

        const dup=draft.einheiten.find(e=>e.bezeichnung===r.einheit.bezeichnung&&e.mieter===r.einheit.mieter);
        if(!dup) draft.einheiten.push({bezeichnung:r.einheit.bezeichnung||('Einheit '+(draft.einheiten.length+1)),mieter:r.einheit.mieter||'',flaeche:+r.einheit.flaeche||null,kaltmiete:+r.einheit.kaltmiete||null,nk:+r.einheit.nk||0,hk:+r.einheit.hk||0,mietbeginn:r.einheit.mietbeginn||'',mietart:r.einheit.index?'index':'standard'});

    show();
  }

/* ========== Verkauf ========== */
function monateSeit(datumStr){
  const d=new Date(datumStr), t=today();
  return Math.max(0,(t.getFullYear()-d.getFullYear())*12+(t.getMonth()-d.getMonth()));
}
function restschuldHeute(o){
  const f=o.finanzierung||{};
  const b=f.restschuld_basis;
  if(!b||b.betrag==null) return null;
  return Math.max(0, Math.round(b.betrag - monateSeit(b.datum)*(f.tilgung_monat||0)));
}
function marktwertHeute(o){
  const v=o.verkauf||{};
  if(v.marktwert_manuell) return {wert:v.marktwert_manuell, basis:'manuell'+(v.marktwert_datum?' ('+D(v.marktwert_datum)+')':'')};
  if(!o.kaufpreis||!o.kaufdatum) return null;
  const jahre=monateSeit(o.kaufdatum)/12;
  const p=(v.wertsteigerung_pa??0)/100;
  return {wert:Math.round(o.kaufpreis*Math.pow(1+p,jahre)), basis:(v.wertsteigerung_pa>=0?'+':'')+(v.wertsteigerung_pa??0).toLocaleString('de-DE')+' %/Jahr seit Kauf'};
}
function fristFrei(o){
  const v=o.verkauf||{};
  let d=null;
  if(v.frist_frei) d=new Date(v.frist_frei);
  else if(o.kaufdatum){ d=new Date(o.kaufdatum); d.setFullYear(d.getFullYear()+10); d.setDate(d.getDate()+1); }
  if(!d) return null;
  const t=today();
  const frei=d<=t;
  const mon=Math.max(0,(d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth()));
  return {datum:d, frei, restJahre:Math.floor(mon/12), restMonate:mon%12};
}

/* ========== Vermögensaufbau (AfA + Tilgung, ohne Miet-Cashflow) ========== */
function tilgungJahr(o){
  const f=o.finanzierung||{};
  if(f.darlehen&&f.tilgung) return f.darlehen*f.tilgung/100;      // anfängliche Tilgung p.a.
  if(f.tilgung_monat) return f.tilgung_monat*12;
  return null;
}
function tilgung10J(o){
  const f=o.finanzierung||{};
  if(f.darlehen&&f.tilgung&&f.zins){
    const r=f.zins/100, t=f.tilgung/100;
    return f.darlehen*t*(Math.pow(1+r,10)-1)/r;                  // getilgtes Kapital nach 10 J. (Annuität)
  }
  const tj=tilgungJahr(o);
  return tj!=null?tj*10:null;
}

let NKSEL=null, NKJAHR=(new Date().getFullYear()-1);
const NK_KATS=[
 ['grundsteuer','Grundsteuer'],
 ['geb_versicherung','Gebäudeversicherung'],
 ['haftpflicht','Haus- & Grundbesitzerhaftpflicht'],
 ['wasser','Wasser / Abwasser'],

function nkGet(objId,jahr){
  NKDATA[objId]=NKDATA[objId]||{};
  if(!NKDATA[objId][jahr]) NKDATA[objId][jahr]={von:jahr+'-01-01',bis:jahr+'-12-31',pos:{}};
  const d=NKDATA[objId][jahr];
  NK_KATS.forEach(([k])=>{ if(!d.pos[k]) d.pos[k]={betrag:null,da:false,um:k!=='sonstige'||false,s:'fl'}; if(d.pos[k].um==null) d.pos[k].um=true; });
  return d;
}
function nkSave(){ store.set('ic_nk',NKDATA); }
function nkIst(p){ return (p&&p.belege&&p.belege.length)||(p&&p.da?1:0); }
function nkProgress(o,jahr){
  const d=NKDATA[o.id]?.[jahr]; const soll=NKDATA[o.id]?.soll||{}; const na=NKDATA[o.id]?.na||{};
  const fehl=[], offen=[];
  let da=0, rel=0;
  NK_KATS.forEach(([k,label])=>{
    if(na[k]) return;                 // Position entfällt bei diesem Objekt
    rel++;
    const p=d?.pos?.[k]; const ist=nkIst(p); const need=+soll[k]||0;
    const ok=need>0?ist>=need:!!p?.da;
    if(ok) da++;
    else if(need>0) fehl.push(label+' ('+ist+' von '+need+' Belegen)');
    else offen.push(label);
  });
  return {da,rel,fehl,offen};
}

function nkCalc(o){
  const d=nkGet(o.id,NKJAHR);
  const von=new Date(d.von), bis=new Date(d.bis);
  const totalDays=Math.round((bis-von)/864e5)+1;
  if(!(totalDays>0)) return null;
  const units=o.einheiten;
  const flSum=units.reduce((s,e)=>s+(e.flaeche||0),0);
  const posList=NK_KATS.map(([k,label])=>({k,label,...d.pos[k]})).filter(x=>x.um&&x.betrag>0);
  const res=units.map(e=>{
    let start=von;
    if(e.mietbeginn){ const mb=new Date(e.mietbeginn); if(mb>von) start=mb; }
    const days=e.mieter?Math.max(0,Math.round((bis-start)/864e5)+1):0;
    const zeitanteil=days/totalDays;
    const posten=posList.map(x=>{
      const share=x.s==='ein'?1/units.length:((e.flaeche||0)/(flSum||1));
      return {label:x.label,gesamt:x.betrag,schl:x.s==='ein'?'je Einheit':'Wohnfläche',anteil:x.betrag*share*zeitanteil};
    });
    const kosten=posten.reduce((s,x)=>s+x.anteil,0);
    const voraus=((e.nk||0)+(e.hk||0))*12*zeitanteil;
    return {e,days,totalDays,start,posten,kosten,voraus,saldo:kosten-voraus};
  });
  return {res,von,bis,posList,flSum};
}

function nkImport(file,msgEl){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(j.typ!=='nk-import'||!Array.isArray(j.objekte)) throw new Error('Kein nk-import-Format');
      const jahr=j.jahr||NKJAHR; NKJAHR=jahr;
      let hits=0, misses=[];
      j.objekte.forEach(entry=>{
        const o=DATA.objekte.find(x=>x.id===entry.objekt||x.name.toLowerCase().includes(String(entry.objekt||'').toLowerCase())||String(entry.objekt||'').toLowerCase().includes(x.name.toLowerCase().slice(0,12)));
        if(!o){ misses.push(entry.objekt); return; }
        const d=nkGet(o.id,jahr);
        (entry.positionen||[]).forEach(p=>{
          let k=p.kat&&d.pos[p.kat]?p.kat:null;
          if(!k){ const lbl=String(p.label||p.kat||'').toLowerCase();
            k=(NK_KATS.find(([kk,ll])=>ll.toLowerCase().includes(lbl)||lbl.includes(kk))||['sonstige'])[0]; }
          const pos=d.pos[k];
          pos.betrag=(k==='sonstige'&&pos.betrag?pos.betrag:0)+(+p.betrag||0);
          if(k!=='sonstige') pos.betrag=+p.betrag||pos.betrag;
          pos.da=true; pos.um=pos.um!==false;
          if(p.beleg) pos.beleg=p.beleg;
          hits++;
        });
        if(entry.von) d.von=entry.von; if(entry.bis) d.bis=entry.bis;
      });
      nkSave();
      if(msgEl) msgEl.textContent=`${hits} Position(en) übernommen.`+(misses.length?` Nicht zugeordnet: ${misses.join(', ')}`:'');
      setTimeout(render,900);
    }catch(err){ if(msgEl) msgEl.textContent='Import fehlgeschlagen: '+err.message; }
  };
  rd.readAsText(file);
}

      box.innerHTML=`<div class="card"><h3>Abrechnung ${NKJAHR}</h3>
      <table><thead><tr><th>Einheit / Mieter</th><th class="num">Fläche</th><th class="num">Zeitanteil</th><th class="num">Kostenanteil</th><th class="num">Vorauszahlung</th><th class="num">Ergebnis</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      ${eigAnteil>0?`<p class="note" style="margin-top:8px">Leerstandsanteil (trägst du): ${EUR2(Math.round(eigAnteil*100)/100)}</p>`:''}
      <p class="note" style="margin-top:6px">Bitte Beträge und Verteilerschlüssel vor Versand prüfen – die Abrechnung ist rechtlich bindend, Fehler machen sie angreifbar.</p></div>`;
      box.querySelectorAll('[data-nkbrief]').forEach(el=>el.addEventListener('click',()=>{
        const r=c.res[+el.dataset.nkbrief];
        textDialog('NK-Abrechnung '+NKJAHR+': '+(r.e.mieter||r.e.bezeichnung), briefNK(o,r,c.von,c.bis));
      }));
      box.querySelectorAll('[data-nkpdf]').forEach(el=>el.addEventListener('click',()=>{
        nkPdf(o,c.res[+el.dataset.nkpdf],c);

      if(window.innerWidth<=840){ mobileTables(box); }
    };
    const cb=document.getElementById('nkCalc');
    if(cb) cb.addEventListener('click',()=>doCalc(false));
  }

/* ---- Beleg-Upload mit KI-Auswertung (Claude API) ---- */
async function nkExtractFile(file){
  const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
  const isImg=/\.(jpe?g|png|webp)$/i.test(file.name);
  if(!isPdf&&!isImg) return {skip:'übersprungen (kein PDF/Bild)'};
  if(file.size>15*1024*1024) return {skip:'übersprungen (>15 MB)'};
  if(file.size<200) return {skip:'übersprungen (leer – vermutlich nicht aus iCloud geladen)'};
  const b64d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
  const kats=NK_KATS.map(([k,l])=>k+' ('+l+')').join(', ');
  const content=[
    isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64d}}
         :{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64d}},
    {type:'text',text:'Prüfe, ob dies ein Kostenbeleg für die Betriebskostenabrechnung eines Wohnhauses ist (Jahresrechnung, Bescheid, Police, Handwerker-/Dienstleisterrechnung). Antworte NUR mit einem JSON-Objekt, ohne Erklärtext: {"relevant":true/false,"kat":"eine dieser Kategorien: '+kats+'","betrag":Zahl (Brutto-Gesamtbetrag des Jahres in Euro, Punkt als Dezimaltrenner),"jahr":Abrechnungs-/Leistungsjahr als Zahl,"hinweis":"max 8 Wörter"}. Nicht relevant (relevant:false): Verträge, Vollmachten, Abschlagspläne ohne Jahressumme, Zählerstände, Grundrisse, Mahnungen. Bei Gas-/Heizungsrechnungen kat=heizung, bei Strom für Allgemeinflächen kat=allgemeinstrom, bei Niederschlagswasser-/Entwässerungsgebühren kat=wasser, bei Abfall-/AWS-Gebührenbescheiden kat=muell.'}
  ];
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
    'content-type':'application/json','x-api-key':SETTINGS.apiKey,
    'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'
  },body:JSON.stringify({model:SETTINGS.model||'claude-sonnet-4-5',max_tokens:300,messages:[{role:'user',content}]})});
  const j=await resp.json();
  if(j.error) throw new Error(j.error.message||'API-Fehler');
  const txt=j.content.map(x=>x.text||'').join('');
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('keine auswertbare Antwort');
  return JSON.parse(m[0]);
}
async function nkUpload(files,o){
  const prog=document.getElementById('nkUpProg');
  if(!SETTINGS.apiKey){ prog.innerHTML='<b style="color:var(--bad)">Kein API-Key hinterlegt</b> – unter Einstellungen → Claude API eintragen.'; return; }
  const list=[...files].filter(f=>!f.name.startsWith('.'));
  if(!list.length){ prog.textContent='Keine Dateien gewählt.'; return; }
  const lines=[]; const show=()=>{prog.innerHTML=lines.join('<br>');};
  const batch={};  // jahr -> kat -> {sum, belege[]}
  let done=0;
  for(const f of list){
    lines.push('⏳ '+esc(f.name)); show();
    try{
      const r=await nkExtractFile(f);
      if(r.skip){ lines[lines.length-1]='– '+esc(f.name)+' <span class="mut">'+esc(r.skip)+'</span>'; }
      else if(!r.relevant||!(+r.betrag>0)){ lines[lines.length-1]='– '+esc(f.name)+' <span class="mut">nicht NK-relevant'+(r.hinweis?' ('+esc(r.hinweis)+')':'')+'</span>'; }
      else{
        const jahr=(+r.jahr>=2000&&+r.jahr<2100)?+r.jahr:NKJAHR;
        const kat=NK_KATS.some(([k])=>k===r.kat)?r.kat:'sonstige';
        batch[jahr]=batch[jahr]||{}; batch[jahr][kat]=batch[jahr][kat]||[];
        batch[jahr][kat].push({name:f.name,betrag:+r.betrag});
        lines[lines.length-1]='✓ '+esc(f.name)+' → <b>'+esc((NK_KATS.find(([k])=>k===kat)||['',kat])[1])+'</b> '+EUR2(+r.betrag)+' ('+jahr+')';
        done++;
      }
    }catch(e){ lines[lines.length-1]='✗ '+esc(f.name)+' <span style="color:var(--bad)">'+esc(e.message)+'</span>'; }
    show();
  }
  Object.entries(batch).forEach(([jahr,kats])=>{
    const d=nkGet(o.id,+jahr);
    Object.entries(kats).forEach(([kat,neue])=>{
      const pos=d.pos[kat];
      pos.belege=pos.belege||[];
      neue.forEach(n=>{
        const i=pos.belege.findIndex(x=>x.name===n.name);
        if(i>=0) pos.belege[i]=n; else pos.belege.push(n);
      });
      pos.betrag=Math.round(pos.belege.reduce((s,x)=>s+x.betrag,0)*100)/100;
      pos.da=true; pos.um=pos.um!==false;
      pos.beleg=pos.belege.map(x=>x.name).join(', ');
    });
  });
  nkSave();
  lines.push('<b>'+done+' Beleg(e) übernommen.</b> Ansicht aktualisiert sich …'); show();
  setTimeout(render,2200);
}

let RS_ = store.get('ic_rechner') || {kaufpreis:167500, eigenkapital:30000, mieteQm:9.0, wohnflaeche:54, zins:4.0, tilgung:2.0, steuersatz:47.475, nkSatz:10.57, afaSatz:2.0, instandQm:15};
const RSL=[
 {k:'kaufpreis',   lbl:'Kaufpreis',              min:50000, max:2000000, step:2500, unit:'€'},
 {k:'eigenkapital',lbl:'Eigenkapital (inkl. NK)',min:0,     max:1000000, step:5000, unit:'€'},
 {k:'nkSatz',      lbl:'Kaufnebenkosten',        min:0,     max:20,     step:0.01, unit:'%'},
 {k:'wohnflaeche', lbl:'Wohnfläche',             min:20,    max:2000,   step:5,    unit:'m²'},
 {k:'mieteQm',     lbl:'Kaltmiete pro m²',       min:1,     max:30,     step:0.5,  unit:'€/m²'},
 {k:'zins',        lbl:'Zinssatz',               min:0.5,   max:10,     step:0.1,  unit:'%'},
 {k:'tilgung',     lbl:'Tilgung',                min:0.5,   max:10,     step:0.1,  unit:'%'},
 {k:'steuersatz',  lbl:'Steuersatz',             min:25,    max:47.475, step:0.5,  unit:'%'},
 {k:'afaSatz',     lbl:'AfA-Satz',               min:1,     max:5,      step:0.5,  unit:'%'},
 {k:'instandQm',   lbl:'Instandhaltung pro m²/J.',min:0,    max:30,     step:1,    unit:'€'}
];
function rcCalc(){
  const S=RS_;
  const kp=S.kaufpreis, ek=S.eigenkapital, mq=S.mieteQm, wf=S.wohnflaeche, zi=S.zins, ti=S.tilgung, st=S.steuersatz;
  const nk=kp*(S.nkSatz/100);
  const ekKP=Math.max(0,ek-nk);
  const darl=Math.max(0,kp-ekKP);
  const ekQ=ek>0?(ek/(kp+nk))*100:0;
  const annPA=darl*(zi/100+ti/100), annPM=annPA/12;
  const zinsPA=darl*(zi/100), tilgPA=darl*(ti/100);
  const mietM=mq*wf, jnkm=mietM*12;
  const instand=wf*S.instandQm;
  const vVorAfA=jnkm-zinsPA-instand;
  const afaG=kp*0.8, afaPA=afaG*(S.afaSatz/100);
  const vNachAfA=vVorAfA-afaPA;
  const stEff=Math.abs(vNachAfA)*(st/100);
  const stErs=vNachAfA<0?stEff:0, stLast=vNachAfA>0?-stEff:0;
  const cfVorStPA=jnkm-annPA-instand;
  const cfPA=cfVorStPA+stErs+stLast, cfPM=cfPA/12;
  const ekRend=ek>0?((cfPA+tilgPA)/ek)*100:0;
  const brutto=(jnkm/kp)*100, faktor=kp/jnkm, qmP=kp/wf;
  const steuerRuecklPM=(stErs>0?stErs:stLast)/12;
  return {kp,ek,mq,wf,zi,ti,st,nk,ekKP,darl,ekQ,annPA,annPM,zinsPA,tilgPA,mietM,jnkm,instand,vVorAfA,afaG,afaPA,vNachAfA,stErs,stLast,cfVorStPA,cfPA,cfPM,ekRend,brutto,faktor,qmP,steuerRuecklPM};
}

/* ========== Verschlüsselte Geräte-Synchronisation über GitHub ==========
   Daten werden mit AES-GCM (Passwort → PBKDF2) verschlüsselt und als sync.dat
   im Repo abgelegt. Auf GitHub liegt nur unlesbarer Ciphertext.
   Konfiguration (Token + Passwort) bleibt gerätelokal in ic_sync. */
const SYNC_KEYS=['ic_data','ic_payments','ic_assign','ic_order','ic_dismissed','ic_rechner','ic_alerts_off','ic_nk'];
const SYNC_REPO='praxishub-dev/immobilien-cockpit';
const SYNC_FILE='sync.dat';
let SYNCCFG=store.get('ic_sync')||{token:'',pass:'',on:false};
let SYNC_APPLYING=false, syncTimer=null, syncBusy=false;
let lastSyncTs=store.get('ic_sync_ts')||0;
let syncStatus='aus';

function syncSetStatus(s){
  syncStatus=s;
  const el=document.getElementById('syStatus'); if(el) el.textContent=s;
  const dot=document.getElementById('syDot');
  if(dot) dot.style.background = /Fehler|Passwort/.test(s)?'var(--bad)':(/synchron/.test(s)?'var(--good)':'var(--ink-3)');
}
function syncReady(){ return SYNCCFG.on&&SYNCCFG.token&&SYNCCFG.pass&&window.crypto?.subtle; }
async function syncKey(salt){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(SYNCCFG.pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function syncEncrypt(obj){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await syncKey(salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)});
}
async function syncDecrypt(raw){
  const p=JSON.parse(raw);
  const key=await syncKey(unb64(p.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},key,unb64(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function syncHeaders(){ return {'Authorization':'Bearer '+SYNCCFG.token,'Accept':'application/vnd.github+json'}; }
async function syncGetRemote(){
  const r=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/${SYNC_FILE}?ref=main&_=${Date.now()}`,{headers:syncHeaders(),cache:'no-store'});
  if(r.status===404) return {sha:null,raw:null};
  if(!r.ok) throw new Error('GitHub '+r.status);
  const j=await r.json();
  return {sha:j.sha, raw:new TextDecoder().decode(unb64(j.content.replace(/\n/g,'')))};
}
async function syncPush(){
  if(!syncReady()||syncBusy) return;
  syncBusy=true; syncSetStatus('lade hoch …');
  try{
    const state={ts:Date.now(),data:{}};
    SYNC_KEYS.forEach(k=>state.data[k]=store.get(k));
    const body=await syncEncrypt(state);
    for(let att=0;att<2;att++){
      const {sha}=await syncGetRemote();
      const put=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/${SYNC_FILE}`,{method:'PUT',headers:syncHeaders(),
        body:JSON.stringify({message:'sync',content:btoa(unescape(encodeURIComponent(body))),...(sha?{sha}:{}),branch:'main'})});
      if(put.ok){ lastSyncTs=state.ts; store.set('ic_sync_ts',lastSyncTs); syncSetStatus('synchron ('+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+')'); syncBusy=false; return; }
      if(put.status!==409){ throw new Error('GitHub '+put.status); }
    }
    throw new Error('Konflikt');
  }catch(e){ syncSetStatus('Fehler: '+e.message); }
  syncBusy=false;
}
async function syncPull(manual){
  if(!syncReady()||syncBusy) return;
  // nicht mitten in einer Eingabe den Bildschirm neu aufbauen
  if(!manual&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  syncBusy=true;
  try{
    const {raw}=await syncGetRemote();
    if(raw){
      let state;
      try{ state=await syncDecrypt(raw); }
      catch(e){ syncSetStatus('Passwort falsch? Entschlüsselung fehlgeschlagen.'); syncBusy=false; return; }
      if(state.ts>lastSyncTs){
        SYNC_APPLYING=true;
        SYNC_KEYS.forEach(k=>{ if(state.data[k]!=null) store.set(k,state.data[k]); else store.del(k); });
        DATA=store.get('ic_data'); PAYMENTS=store.get('ic_payments')||[]; ASSIGN=store.get('ic_assign')||{};
        if(typeof NKDATA!=='undefined') NKDATA=store.get('ic_nk')||{};
        if(typeof RS_!=='undefined'&&state.data.ic_rechner) RS_=state.data.ic_rechner;
        SYNC_APPLYING=false;
        lastSyncTs=state.ts; store.set('ic_sync_ts',lastSyncTs);
        syncSetStatus('synchron ('+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+')');
        render();
      } else if(manual){ syncSetStatus('synchron – kein neuerer Stand.'); }
    } else if(manual){ syncSetStatus('Noch kein Sync-Stand auf GitHub – zuerst auf dem Gerät mit den Daten „Jetzt hochladen" drücken.'); }
  }catch(e){ syncSetStatus('Fehler: '+e.message); }
  syncBusy=false;
}
function scheduleSyncPush(){
  if(!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncPush,3500);
}
/* store.set abfangen: jede Datenänderung löst (entprellt) einen Push aus */
(function(){
  const orig=store.set.bind(store);
  store.set=(k,v)=>{ orig(k,v); if(SYNC_KEYS.includes(k)){ orig('ic_data_ts',Date.now()); if(!SYNC_APPLYING) scheduleSyncPush(); } };
})();
function syncMakeSetupLink(){
  return 'https://praxishub-dev.github.io/immobilien-cockpit/#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify({t:SYNCCFG.token,p:SYNCCFG.pass}))));
}
/* Einrichtungs-Link: #cfg=… beim Laden übernehmen (Token+Passwort automatisch setzen) */
(function(){
  try{
    const m=location.hash.match(/#cfg=(.+)/);
    if(m){
      const cfg=JSON.parse(decodeURIComponent(escape(atob(m[1].trim()))));
      if(cfg.t&&cfg.p){ SYNCCFG={token:cfg.t,pass:cfg.p,on:true}; store.set('ic_sync',SYNCCFG); }
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    }
  }catch(e){}
})();
function syncInit(){
  if(!syncReady()) return;
  syncPull(false);
  setInterval(()=>syncPull(false),30000);
  window.addEventListener('focus',()=>syncPull(false));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncPull(false); });
}

function mdLite(t){

  h=h.replace(/^[-•] (.*)$/gm,'· $1');
  return h;

    <div class="frow"><div><input type="text" id="syLinkIn" placeholder="https://…#cfg=…"></div><div style="flex:0 0 auto"><button class="btn primary" id="syLinkApply">Übernehmen</button></div></div>
    <p class="note" style="margin-top:8px">Status: <b id="syStatus">${SYNCCFG.on?'aktiv':'aus'}</b></p></div>
  <div class="card"><h3>Daten</h3>
    <div class="btnrow">
      <button class="btn" id="cfLoad">Neue Datendatei laden</button>
      <button class="btn" id="cfExport">Daten exportieren (JSON)</button>
      <button class="btn" id="cfReset" style="color:var(--bad)">Alles zurücksetzen</button>
    </div>
    <input type="file" id="cfFile" accept=".json" style="display:none">
    <p class="note" style="margin-top:10px">Datenstand: ${esc(DATA?.meta?.stand||'–')} · ${DATA?DATA.objekte.length+' Objekte':''} · ${PAYMENTS.length} importierte Umsätze</p></div>
  <div class="card"><h3>Mietspiegel-Referenzwerte (€/m², bearbeitbar)</h3>
    <table><thead><tr><th>Ort</th><th class="num">Vergleichsmiete</th><th class="num">Spanne von</th><th class="num">bis</th><th class="num">Kappung %</th></tr></thead><tbody>
    ${(DATA?.mietspiegel||[]).map((m,i)=>`<tr><td>${esc(m.ort)}</td>
      <td class="num"><input type="number" step="0.1" style="width:80px" data-ms="${i}:wert" value="${m.wert}"></td>
      <td class="num"><input type="number" step="0.1" style="width:80px" data-ms="${i}:s0" value="${m.spanne[0]}"></td>
      <td class="num"><input type="number" step="0.1" style="width:80px" data-ms="${i}:s1" value="${m.spanne[1]}"></td>
      <td class="num"><input type="number" step="5" style="width:70px" data-ms="${i}:kappung" value="${m.kappung}"></td></tr>`).join('')}
    </tbody></table>
    <div class="btnrow"><button class="btn" id="cfMsSave">Referenzwerte speichern</button></div></div>
  <div class="card"><h3>Bankkonten (Zuordnung eingehender Zahlungen)</h3>
    ${(DATA?.meta?.konten||[]).map(k=>`<p class="note" style="margin:4px 0"><b>${esc(k.name)}</b><br><span class="mono">${esc(k.iban)}</span> · ${esc(k.bank)} – ${esc(k.verwendung)}</p>`).join('')||'<p class="note">–</p>'}</div>`;
}
function wireConf(){
  document.getElementById('cfSave').addEventListener('click',()=>{
    SETTINGS.apiKey=document.getElementById('cfKey').value.trim();
    SETTINGS.model=document.getElementById('cfModel').value;
    store.set('ic_settings',SETTINGS); alert('Gespeichert.');
  });
  document.getElementById('sySave').addEventListener('click',()=>{
    try{
      SYNCCFG={token:document.getElementById('syToken').value.trim(),pass:document.getElementById('syPass').value.trim(),on:document.getElementById('syOn').checked};
      store.set('ic_sync',SYNCCFG);
      if(!window.crypto?.subtle){ syncSetStatus('Fehler: Browser unterstützt keine Verschlüsselung (crypto.subtle)'); return; }
      if(syncReady()){ syncSetStatus('gestartet …'); syncInit(); if(DATA) syncPush(); else syncPull(true); }
      else syncSetStatus(SYNCCFG.on?'unvollständig – Token und Passwort nötig':'aus (Haken setzen)');
    }catch(e){ syncSetStatus('Fehler: '+e.message); }
  });
  document.getElementById('syLinkApply').addEventListener('click',()=>{
    try{
      const m=(document.getElementById('syLinkIn').value||'').match(/#cfg=([A-Za-z0-9+/=]+)/);
      if(!m){ syncSetStatus('Kein gültiger Einrichtungs-Link.'); return; }
      const cfg=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      if(!cfg.t||!cfg.p){ syncSetStatus('Link unvollständig.'); return; }
      SYNCCFG={token:cfg.t,pass:cfg.p,on:true}; store.set('ic_sync',SYNCCFG);
      syncSetStatus('eingerichtet – hole Daten …'); syncInit(); syncPull(true);
      setTimeout(render,2500);
    }catch(e){ syncSetStatus('Fehler: '+e.message); }
  });
  document.getElementById('syLink').addEventListener('click',()=>{
    if(!SYNCCFG.token||!SYNCCFG.pass){ syncSetStatus('erst Token + Passwort speichern, dann Link erzeugen'); return; }
    textDialog('Einrichtungs-Link (privat weitergeben!)', syncMakeSetupLink());
  });
  document.getElementById('syPushBtn').addEventListener('click',()=>{ if(syncReady()) syncPush(); else syncSetStatus('erst Token + Passwort speichern'); });
  document.getElementById('syPullBtn').addEventListener('click',()=>{ if(syncReady()) syncPull(true); else syncSetStatus('erst Token + Passwort speichern'); });
  document.getElementById('cfLoad').addEventListener('click',()=>document.getElementById('cfFile').click());
  document.getElementById('cfFile').addEventListener('change',e=>loadDataFile(e.target.files[0]));
  document.getElementById('cfExport').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='immobilien-daten.json';a.click();
  });
  document.getElementById('cfReset').addEventListener('click',()=>{
    if(confirm('Wirklich alle Daten, Umsätze und Einstellungen aus dem Browser löschen?')){
      ['ic_data','ic_settings','ic_assign','ic_payments'].forEach(k=>store.del(k));
      DATA=null;SETTINGS={apiKey:'',model:'claude-sonnet-4-5'};ASSIGN={};PAYMENTS=[];CHAT=[];render();
    }
  });
  document.getElementById('cfMsSave').addEventListener('click',()=>{
    document.querySelectorAll('[data-ms]').forEach(inp=>{
      const [i,f]=inp.dataset.ms.split(':');const m=DATA.mietspiegel[+i];const v=parseFloat(inp.value);
      if(isNaN(v))return;
      if(f==='wert')m.wert=v; else if(f==='s0')m.spanne[0]=v; else if(f==='s1')m.spanne[1]=v; else if(f==='kappung')m.kappung=v;
    });
    store.set('ic_data',DATA); alert('Referenzwerte gespeichert.'); render();
  });
}

/* ========== ICS-Dialog & Start ========== */
document.addEventListener('DOMContentLoaded',()=>{
  // Migration: Miet-Monat für früher importierte Umsätze mit aktueller Logik neu berechnen
  let migrated=false;
  PAYMENTS.forEach(p=>{ if(!p.manual && p.datum){ const m=detectPeriod(p.zweck,p.datum); if(m!==p.monat){ p.monat=m; migrated=true; } } });
  if(migrated) store.set('ic_payments',PAYMENTS);
  const odlg=document.createElement('dialog');
  odlg.id='objDlg'; odlg.style.width='min(620px,94vw)';
  odlg.innerHTML=`<h3 id="objT" style="margin:0 0 10px">Daten bearbeiten</h3><div id="objBody"></div>
  <div class="btnrow" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" onclick="document.getElementById('objDlg').close()">Abbrechen</button>
    <button class="btn primary" id="objSave">Speichern</button></div>`;
  document.body.appendChild(odlg);
  const pdlg=document.createElement('dialog');
  pdlg.id='payDlg'; pdlg.style.width='min(640px,94vw)';
  pdlg.innerHTML=`<h3 id="payT" style="margin:0 0 4px">Zahlungen</h3><div id="payBody"></div>
  <div class="btnrow" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="document.getElementById('payDlg').close()">Schließen</button></div>`;
  document.body.appendChild(pdlg);
  const dlg=document.createElement('dialog');
  dlg.id='icsDlg';
  dlg.innerHTML=`<h3 style="margin:0 0 8px">Erinnerung als .ics</h3>
  <label>Titel</label><input type="text" id="icsT">
  <label>Datum</label><input type="date" id="icsD">
  <label>Notiz</label><textarea id="icsN" rows="3"></textarea>
  <div class="btnrow" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" id="icsCancel">Abbrechen</button>
    <button class="btn primary" id="icsOk">.ics herunterladen</button></div>`;
  document.body.appendChild(dlg);
  const tdlg=document.createElement('dialog');
  tdlg.id='txtDlg'; tdlg.style.width='min(680px,94vw)';
  tdlg.innerHTML=`<h3 id="txtT" style="margin:0 0 10px">Schreiben</h3>
  <textarea id="txtA" rows="20" style="font-size:13px;line-height:1.5"></textarea>
  <div class="btnrow" style="margin-top:12px;justify-content:space-between">
    <span class="note" id="txtHint">Text vor dem Versand prüfen und anpassen.</span>
    <span><button class="btn" id="txtClose">Schließen</button>
    <button class="btn primary" id="txtCopy">📋 Kopieren</button></span></div>`;
  document.body.appendChild(tdlg);
  document.getElementById('txtClose').addEventListener('click',()=>tdlg.close());
  document.getElementById('txtCopy').addEventListener('click',async()=>{
    const ta=document.getElementById('txtA');
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.select(); document.execCommand('copy'); }
    const b=document.getElementById('txtCopy'); b.textContent='✓ Kopiert'; setTimeout(()=>b.textContent='📋 Kopieren',1500);
  });
  document.getElementById('icsCancel').addEventListener('click',()=>dlg.close());
  document.getElementById('icsOk').addEventListener('click',()=>{
    const t=document.getElementById('icsT').value.trim()||'Erinnerung';
    downloadICS(t,document.getElementById('icsD').value,document.getElementById('icsN').value);
    dlg.close();
  });
  render();
  fetchMarktdaten();
  setInterval(fetchMarktdaten,10*60*1000);   // Marktdaten alle 10 Min. prüfen
  syncInit();                                 // Geräte-Sync (falls konfiguriert)
});
</script>
