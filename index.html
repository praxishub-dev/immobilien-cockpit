<style>
:root{

  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8880;

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.45}

<body>
<div id="app">
<nav>
  <h1>Immobilien-Cockpit<small>Specht &amp; Waschkowski</small></h1>

<script>
/* ========== Storage (mit Fallback, falls localStorage nicht verfügbar) ========== */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return mem[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let DATA = store.get('ic_data');
let SETTINGS = store.get('ic_settings') || {apiKey:'', model:'claude-sonnet-4-5'};
let ASSIGN = store.get('ic_assign') || {};      // iban/name-hash -> einheitId (manuelle Zuordnungen)
let PAYMENTS = store.get('ic_payments') || [];   // importierte Umsätze

/* ========== Helpers ========== */
const EUR = n => n==null ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
const EUR2 = n => n==null ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const QM = n => n==null ? '–' : n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €/m²';
const D = s => s ? new Date(s+ (s.length===7?'-01':'')).toLocaleDateString('de-DE',{day:s.length>7?'2-digit':undefined,month:'2-digit',year:'numeric'}) : '–';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9äöüß ]/g,' ').replace(/\s+/g,' ').trim();
const today = () => new Date();
function addMonths(d, m){ const x=new Date(d); x.setMonth(x.getMonth()+m); return x; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function allUnits(){ const u=[]; (DATA?.objekte||[]).forEach(o=>o.einheiten.forEach(e=>u.push({o,e}))); return u; }
function unitById(id){ return allUnits().find(x=>x.e.id===id); }
function warm(e){ return (e.kaltmiete||0)+(e.nk||0)+(e.hk||0); }
function mietspiegelOf(ort){ return (DATA?.mietspiegel||[]).find(m=>m.ort===ort); }

/* ========== Mietspiegel- & Erhöhungslogik (§558/§557b BGB, vereinfacht) ========== */
function mietCheck(o, e){
  const ms = mietspiegelOf(o.ort);
  const r = {qm:null, status:'unbekannt', ampel:'mut', text:'', potenzial:0, naechsteErhoehung:null, hinweis:[]};
  if(e.flaeche && e.kaltmiete){ r.qm = e.kaltmiete/e.flaeche; }
  if(e.gewerbe || e.mietart==='gewerbe'){
    r.status='Gewerbe'; r.ampel='mut'; r.text='Gewerbemiete – Erhöhung nur nach Vertrag (Staffel/Index/Option).';
    return r;
  }
  if(!ms || r.qm==null){ r.text='Keine Vergleichsdaten.'; return r; }
  const [lo,hi]=ms.spanne;
  if(r.qm < lo){ r.status='deutlich unter Markt'; r.ampel='bad'; }
  else if(r.qm < ms.wert){ r.status='unter Vergleichsmiete'; r.ampel='warn'; }
  else if(r.qm <= hi){ r.status='marktgerecht'; r.ampel='good'; }
  else { r.status='über Marktspanne'; r.ampel='info'; }
  // Wartefrist §558: neues Erhöhungsverlangen frühestens 12 Monate nach letzter Erhöhung, wirksam +3 Monate = 15 Monate
  const basisDatum = e.letzte_erhoehung ? new Date(e.letzte_erhoehung.datum) : (e.mietbeginn?new Date(e.mietbeginn):null);
  if(e.mietart==='index'){
    r.hinweis.push('Indexmietvertrag (§557b): Anpassung gemäß VPI, frühestens 12 Monate nach letzter Anpassung; §558/Mietspiegel nicht anwendbar.');
    r.naechsteErhoehung = basisDatum ? addMonths(basisDatum,12) : null;
  } else {
    r.naechsteErhoehung = basisDatum ? addMonths(basisDatum,15) : null;
    // Kappungsgrenze: max +kappung% in 3 Jahren (vereinfachte Basis: Miete vor letzter Erhöhung, falls <3 Jahre her, sonst aktuelle Miete)
    const kapp = (ms.kappung||20)/100;
    let basisMiete = e.kaltmiete;
    if(e.letzte_erhoehung && (today()-new Date(e.letzte_erhoehung.datum)) < 3*365.25*864e5){ basisMiete = e.letzte_erhoehung.alt; }
    const maxKappung = basisMiete*(1+kapp);
    const ziel = Math.min(ms.wert*e.flaeche, maxKappung);
    r.potenzial = Math.max(0, Math.round(ziel - e.kaltmiete));
    if(r.potenzial>0){
      r.hinweis.push(`Bis Vergleichsmiete (${QM(ms.wert)}) und Kappungsgrenze (${ms.kappung} %/3 J.) sind ca. +${EUR(r.potenzial)}/Monat möglich.`);
    }
    if(ziel===maxKappung && ms.wert*e.flaeche>maxKappung) r.hinweis.push('Kappungsgrenze limitiert – volle Vergleichsmiete erst in mehreren Schritten erreichbar.');
  }
  if(e.besonderheiten && /verzicht/i.test(e.besonderheiten)) r.hinweis.push('Achtung: vertraglicher Erhöhungsverzicht – siehe Besonderheiten.');
  const fr = r.naechsteErhoehung;
  r.text = `${r.status}. ${fr ? (fr<=today() ? 'Erhöhung ab sofort möglich.' : 'Nächste Erhöhung wirksam ab '+fr.toLocaleDateString('de-DE')+'.') : ''}`;
  return r;
}

/* ========== Automatische Erinnerungsvorschläge ========== */
function autoReminders(){
  const list=[];
  const t=today();
  allUnits().forEach(({o,e})=>{
    const c = mietCheck(o,e);
    if(!e.gewerbe && c.potenzial>50 && c.naechsteErhoehung){
      const d = c.naechsteErhoehung<t ? addMonths(t,0) : c.naechsteErhoehung;
      list.push({titel:`Mieterhöhung prüfen: ${e.bezeichnung} (${e.mieter||'–'})`, datum:isoDate(addMonths(d,-2)), notiz:`${o.name} – Potenzial ca. +${c.potenzial} €/Monat. Wirksam frühestens ${d.toLocaleDateString('de-DE')}. Quelle Mietspiegel: ${mietspiegelOf(o.ort)?.quelle||''}`, kat:'Mieterhöhung'});
    }
    if(e.mietart==='index'){
      const basis = e.letzte_erhoehung? new Date(e.letzte_erhoehung.datum) : (e.mietbeginn?new Date(e.mietbeginn):null);
      if(basis) list.push({titel:`Indexanpassung prüfen: ${e.bezeichnung}`, datum:isoDate(addMonths(basis,12)), notiz:`${o.name} – VPI-Entwicklung seit ${basis.toLocaleDateString('de-DE')} prüfen (§557b).`, kat:'Indexmiete'});
    }
  });
  (DATA?.objekte||[]).forEach(o=>{
    if(o.finanzierung?.zinsbindung_ende){
      list.push({titel:`Anschlussfinanzierung: ${o.name}`, datum:isoDate(addMonths(new Date(o.finanzierung.zinsbindung_ende),-12)), notiz:`Zinsbindung endet am ${D(o.finanzierung.zinsbindung_ende)} (${o.finanzierung.bank||''}). 12 Monate vorher Konditionen vergleichen.`, kat:'Finanzierung'});
    }
  });
  // Betriebskostenabrechnung: Frist 31.12. für Vorjahr
  const jahr = t.getFullYear();
  list.push({titel:`Betriebskostenabrechnungen ${jahr-1} versenden (Frist 31.12.${jahr})`, datum:`${jahr}-10-01`, notiz:'Abrechnungsfrist §556 Abs. 3 BGB: 12 Monate nach Ende des Abrechnungszeitraums.', kat:'Nebenkosten'});
  list.push({titel:'Braustraße 8: Mietkonto-Umstellung an alle Mieter kommunizieren', datum:'2026-08-03', notiz:'Nach Eigentumsübergang 01.08.2026 neue Bankverbindung mitteilen (bisher Konto Voreigentümer Burat & Neugeboren).', kat:'Verwaltung'});
  return list.sort((a,b)=>a.datum.localeCompare(b.datum));
}

/* ========== ICS-Erstellung ========== */
function makeICS(titel, datum, notiz){
  const dt = datum.replace(/-/g,'');
  const uid = 'ic-'+Math.abs([...titel+datum].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))+'@immobilien-cockpit';
  const escT = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Immobilien-Cockpit//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+uid,'DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+escT(titel),'DESCRIPTION:'+escT(notiz),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+escT(titel),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function downloadICS(titel, datum, notiz){
  const blob = new Blob([makeICS(titel,datum,notiz)],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=titel.replace(/[^\wäöüß -]/gi,'').slice(0,60)+'.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function icsDialog(pre){
  const dlg=document.getElementById('icsDlg');
  document.getElementById('icsT').value=pre?.titel||'';
  document.getElementById('icsD').value=pre?.datum||isoDate(today());
  document.getElementById('icsN').value=pre?.notiz||'';
  dlg.showModal();
}

/* ========== Brief-Generator (Mieterhöhung / Zahlungserinnerung) ========== */
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function monatName(ym){ const [y,m]=ym.split('-'); return MONATE[+m-1]+' '+y; }
function anredeFor(mieter){
  if(!mieter) return 'Sehr geehrte Damen und Herren,';
  const m=mieter.replace(/\(.*?\)/g,'');
  if(/&|und| u\. /.test(m) || /familie/i.test(m)) return 'Sehr geehrte Mieterinnen und Mieter,';
  if(/^frau|^fr\./i.test(m.trim())) return 'Sehr geehrte '+m.trim()+',';
  return 'Sehr geehrte/r '+m.trim()+',';
}
function absenderFor(o){
  return /eGbR|GbR/i.test(o.eigentuemer||'') ? (o.eigentuemer.replace(/ \(.*\)/,'')) : 'Christian Specht';
}
function endeMonatPlus(n){ const t=today(); return new Date(t.getFullYear(), t.getMonth()+n+1, 0); }
function ersterMonatPlus(n){ const t=today(); return new Date(t.getFullYear(), t.getMonth()+n, 1); }
const DFMT=d=>d.toLocaleDateString('de-DE');
function briefErhoehung(o,e){
  const ms=mietspiegelOf(o.ort), c=mietCheck(o,e);
  const neu=Math.round(e.kaltmiete + (c.potenzial||0)) || Math.round((ms?.wert||0)*(e.flaeche||0));
  const diff=neu-e.kaltmiete;
  const zustimmung=endeMonatPlus(2), wirksam=ersterMonatPlus(3);
  const gesamtNeu=neu+(e.nk||0)+(e.hk||0);
  if(e.gewerbe||e.mietart==='gewerbe'){
    return `${absenderFor(o)}\n\n${e.mieter||'[Mieter]'}\n${o.adresse} – ${e.bezeichnung}\n\nAnpassung der Miete – ${e.bezeichnung}, ${o.adresse}\n\n${anredeFor(e.mieter)}\n\nbezugnehmend auf die Regelungen unseres Mietvertrags möchten wir die monatliche Nettomiete von derzeit ${EUR2(e.kaltmiete)} zum ${DFMT(wirksam)} auf ${EUR2(neu)} anpassen. [Vertragliche Grundlage hier einsetzen: Staffel/Index/Optionsregelung.]\n\nDie Nebenkostenvorauszahlungen bleiben unverändert.\n\nBitte bestätigen Sie uns die Anpassung kurz schriftlich.\n\nMit freundlichen Grüßen\n${absenderFor(o)}`;
  }
  if(e.mietart==='index'){
    const basis=e.letzte_erhoehung?D(e.letzte_erhoehung.datum):(e.mietbeginn?D(e.mietbeginn):'[Datum]');
    return `${absenderFor(o)}\n\n${e.mieter||'[Mieter]'}\n${o.adresse} – ${e.bezeichnung}\n\nAnpassung der Indexmiete gemäß § 557b BGB – ${e.bezeichnung}, ${o.adresse}\n\n${anredeFor(e.mieter)}\n\nin Ihrem Mietvertrag ist eine Indexmiete gemäß § 557b BGB vereinbart. Die Miete ist an den Verbraucherpreisindex (VPI) des Statistischen Bundesamtes gekoppelt.\n\nSeit der letzten Mietfestsetzung am ${basis} hat sich der VPI wie folgt entwickelt:\n- VPI alt (${basis}): [Indexstand alt] Punkte\n- VPI aktuell: [Indexstand neu] Punkte\n- Veränderung: [+X,X] %\n\nEntsprechend erhöht sich die monatliche Nettokaltmiete von derzeit ${EUR2(e.kaltmiete)} um [X,XX] € auf [neuer Betrag] € mit Wirkung ab dem ${DFMT(ersterMonatPlus(2))} (Beginn des übernächsten Monats nach Zugang dieser Erklärung, § 557b Abs. 3 BGB). Die Vorauszahlungen für Nebenkosten bleiben unverändert.\n\nDie aktuellen Indexstände finden Sie unter www.destatis.de.\n\nMit freundlichen Grüßen\n${absenderFor(o)}\n\n[Hinweis für dich: VPI-Stände unter destatis.de nachschlagen und die Platzhalter ersetzen. Frühestens 12 Monate nach letzter Anpassung zulässig.]`;
  }
  if(diff<=0){
    const vorschlag=ms&&e.flaeche?Math.round(ms.wert*e.flaeche):null;
    const zielV=vorschlag&&vorschlag>e.kaltmiete?vorschlag:'[neuer Betrag]';
    const zielG=typeof zielV==='number'?EUR2(zielV+(e.nk||0)+(e.hk||0)):'[Gesamtmiete]';
    return `${absenderFor(o)}\n\n${e.mieter||'[Mieter]'}\n${o.adresse} – ${e.bezeichnung}\n\nVorschlag zur einvernehmlichen Anpassung der Miete – ${e.bezeichnung}, ${o.adresse}\n\n${anredeFor(e.mieter)}\n\ndie monatliche Nettokaltmiete für die von Ihnen gemietete Wohnung (ca. ${e.flaeche||'[Fläche]'} m²) beträgt derzeit ${EUR2(e.kaltmiete)}${c.qm?` (${QM(c.qm)})`:''}. Die ortsübliche Vergleichsmiete in ${o.ort} liegt bei ca. ${ms?QM(ms.wert):'[Wert]'}.\n\nWir schlagen Ihnen eine einvernehmliche Anpassung der Nettokaltmiete auf ${typeof zielV==='number'?EUR2(zielV):zielV} mit Wirkung ab dem ${DFMT(ersterMonatPlus(2))} vor (Vereinbarung gemäß § 557 Abs. 1 BGB). Die Vorauszahlungen für Betriebs- und Heizkosten bleiben unverändert; die monatliche Gesamtmiete beträgt dann ${zielG}.\n\nMit dieser Vereinbarung besteht für beide Seiten Planungssicherheit. Wenn Sie einverstanden sind, bestätigen Sie uns dies bitte durch Unterschrift auf der Kopie dieses Schreibens. Gern besprechen wir den Vorschlag auch persönlich.\n\nMit freundlichen Grüßen\n${absenderFor(o)}\n\n________________________\nEinverstanden (Datum, Unterschrift Mieter)\n\n[Hinweis für dich: Eine förmliche Erhöhung nach § 558 BGB ist aktuell durch die Kappungsgrenze/Sperrfrist blockiert – daher einvernehmlicher Weg. Der Mieter muss nicht zustimmen. Betrag vor Versand anpassen. Keine Rechtsberatung.]`;
  }
  return `${absenderFor(o)}\n\n${e.mieter||'[Mieter]'}\n${o.adresse} – ${e.bezeichnung}\n\nMieterhöhungsverlangen gemäß § 558 BGB – ${e.bezeichnung}, ${o.adresse}\n\n${anredeFor(e.mieter)}\n\ndie monatliche Nettokaltmiete für die von Ihnen gemietete Wohnung (ca. ${e.flaeche||'[Fläche]'} m²) beträgt derzeit ${EUR2(e.kaltmiete)}${c.qm?` (${QM(c.qm)})`:''}. Die ortsübliche Vergleichsmiete in ${o.ort} liegt bei ca. ${ms?QM(ms.wert):'[Wert]'}${ms?` (Quelle: ${ms.quelle.split('(')[0].trim()})`:''}.\n\nWir bitten Sie hiermit um Ihre Zustimmung zur Erhöhung der monatlichen Nettokaltmiete von ${EUR2(e.kaltmiete)} um ${EUR2(diff)} auf ${EUR2(neu)} mit Wirkung ab dem ${DFMT(wirksam)}.\n\nDie Erhöhung wahrt die Kappungsgrenze von ${ms?ms.kappung:20} % innerhalb von drei Jahren (§ 558 Abs. 3 BGB); die letzte Mieterhöhung liegt mehr als zwölf Monate zurück (§ 558 Abs. 1 BGB). Die Vorauszahlungen für Betriebs- und Heizkosten bleiben unverändert, sodass die monatliche Gesamtmiete künftig ${EUR2(gesamtNeu)} beträgt.\n\nBitte erteilen Sie uns Ihre Zustimmung bis zum ${DFMT(zustimmung)} (§ 558b Abs. 2 BGB), z. B. durch kurze schriftliche Bestätigung oder Unterschrift auf der Kopie dieses Schreibens.\n\nFür Rückfragen stehen wir gern zur Verfügung.\n\nMit freundlichen Grüßen\n${absenderFor(o)}\n\n________________________\nZustimmung des Mieters / der Mieter (Datum, Unterschrift)\n\n[Hinweis für dich: Betrag und Wirkdatum vor Versand prüfen. Bei Portal-Vergleichswerten ohne offiziellen Mietspiegel ist die Begründung angreifbar – ggf. drei Vergleichswohnungen benennen oder einvernehmliche Anpassung vereinbaren. Keine Rechtsberatung.]`;
}
function offeneMonate(o,e){
  const perOf=p=>p.monat||p.datum?.slice(0,7);
  const credits=PAYMENTS.filter(p=>p.betrag>0);
  const months=[...new Set(credits.map(perOf).filter(Boolean))].sort();
  const beginn=e.mietbeginn?e.mietbeginn.slice(0,7):null;
  const soll=warm(e);
  // Erster Monat, in dem für diese Einheit eine Zahlung erkannt wurde: frühere Monate liegen
  // i.d.R. vor dem Exportfenster des Kontoauszugs und werden nicht als offen gewertet.
  const paidMonths=months.filter(m=>credits.some(p=>perOf(p)===m && matchPayment(p)===e.id));
  const firstPaid=paidMonths[0]||null;
  const out=[];
  for(const m of months){
    if(beginn && m<beginn) continue;
    if(firstPaid && m<firstPaid) continue;
    const ist=credits.filter(p=>perOf(p)===m && matchPayment(p)===e.id).reduce((s,p)=>s+p.betrag,0);
    if(ist+0.01<soll) out.push({monat:m, soll, ist, offen:Math.round((soll-ist)*100)/100});
  }
  return out;
}
function briefMahnung(o,e){
  const off=offeneMonate(o,e);
  const gesamt=off.reduce((s,x)=>s+x.offen,0);
  const konto=(DATA.meta?.konten||[]).find(k=>k.iban===o.mietkonto);
  const ibanFmt=(o.mietkonto||'[IBAN]').replace(/(.{4})/g,'$1 ').trim();
  const frist=new Date(today().getTime()+7*864e5);
  const liste=off.map(x=>`- ${monatName(x.monat)}: offen ${EUR2(x.offen)} (Soll ${EUR2(x.soll)}, eingegangen ${EUR2(x.ist)})`).join('\n');
  const eskalation = gesamt >= 2*warm(e)-1 ?
`\n\nWir weisen darauf hin, dass Sie sich mit den genannten Beträgen in Zahlungsverzug befinden (§ 286 BGB). Bei einem Rückstand in Höhe von zwei Monatsmieten sind wir berechtigt, das Mietverhältnis fristlos zu kündigen (§ 543 Abs. 2 Nr. 3 BGB). Wir möchten diesen Schritt vermeiden – bitte nehmen Sie bei Zahlungsschwierigkeiten kurzfristig Kontakt mit uns auf.` :
(off.length>1?`\n\nSie befinden sich mit den genannten Beträgen in Zahlungsverzug (§ 286 BGB). Bitte gleichen Sie den Rückstand zeitnah aus.`:'');
  return `${absenderFor(o)}\n\n${e.mieter||'[Mieter]'}\n${o.adresse} – ${e.bezeichnung}\n\nZahlungserinnerung – Miete ${off.length===1?monatName(off[0].monat):'(mehrere Monate)'} – ${e.bezeichnung}, ${o.adresse}\n\n${anredeFor(e.mieter)}\n\nbei der Durchsicht unserer Kontoeingänge haben wir festgestellt, dass für die von Ihnen gemietete Einheit folgende Mietzahlungen noch nicht bzw. nicht vollständig eingegangen sind:\n\n${liste||'- [keine offenen Monate in den importierten Umsätzen gefunden – bitte prüfen]'}\n\nOffener Gesamtbetrag: ${EUR2(gesamt)}\n\nBitte überweisen Sie den offenen Betrag bis zum ${DFMT(frist)} auf folgendes Konto:\n\nKontoinhaber: ${konto?konto.name.split('–')[0].trim():absenderFor(o)}\nIBAN: ${ibanFmt}${konto?`\nBank: ${konto.bank}`:''}\nVerwendungszweck: Miete ${e.bezeichnung}, ${off.map(x=>monatName(x.monat)).join(' + ')}\n\nSollte sich Ihre Zahlung mit diesem Schreiben überschnitten haben, betrachten Sie es bitte als gegenstandslos.${eskalation}\n\nMit freundlichen Grüßen\n${absenderFor(o)}`;
}
function zahlungsStatus(o,e){
  if(!e.mieter || !PAYMENTS.some(p=>p.betrag>0)) return {kind:'nodata'};
  const off=offeneMonate(o,e);
  if(!off.length) return {kind:'paid'};
  const anyObj=o.einheiten.some(u=>PAYMENTS.some(p=>p.betrag>0 && matchPayment(p)===u.id));
  if(!anyObj) return {kind:'noacct'};
  return {kind:'open', off, sum:Math.round(off.reduce((s,x)=>s+x.offen,0)*100)/100, seit:off[0].monat};
}
function zahlungsZelle(o,e){
  const z=zahlungsStatus(o,e);
  if(z.kind==='nodata') return '<span class="mut">–</span>';
  if(z.kind==='noacct') return '<span class="badge b-mut" title="Für dieses Objekt sind keine Kontoumsätze importiert">Konto fehlt</span>';
  if(z.kind==='paid') return '<span class="badge b-good">bezahlt</span>';
  const teil=z.off.some(x=>x.ist>0);
  return `<span class="badge b-${teil&&z.off.length===1?'warn':'bad'}">${EUR2(z.sum)} offen</span><br>
  <span class="mut">seit ${monatName(z.seit)}${z.off.length>1?` · ${z.off.length} Monate`:''}</span><br>
  <button class="btn small" style="margin-top:3px" data-brief='{"kind":"mahn","id":"${e.id}"}'>✉ Erinnerung</button>`;
}

/* ========== Router ========== */
let VIEW='dash', DETAIL=null;
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  VIEW=b.dataset.v; DETAIL=null;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
  render();
}));
function render(){
  const m=document.getElementById('main');
  if(!DATA){ m.innerHTML=viewNoData(); wireNoData(); return; }
  if(VIEW==='dash') m.innerHTML=viewDash();
  else if(VIEW==='objekte') m.innerHTML=DETAIL?viewObjektDetail(DETAIL):viewObjekte();
  else if(VIEW==='bank'){ m.innerHTML=viewBank(); wireBank(); }
  else if(VIEW==='miet') m.innerHTML=viewMiet();
  else if(VIEW==='erinner') m.innerHTML=viewErinner();
  else if(VIEW==='ki'){ m.innerHTML=viewKI(); wireKI(); }
  else if(VIEW==='conf'){ m.innerHTML=viewConf(); wireConf(); }
  m.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();DETAIL=el.dataset.open;VIEW='objekte';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.v==='objekte'));render();}));
  m.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',()=>{DETAIL=null;render();}));
  m.querySelectorAll('[data-ics]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();icsDialog(JSON.parse(el.dataset.ics));}));
  m.querySelectorAll('[data-icsdirect]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();const p=JSON.parse(el.dataset.icsdirect);downloadICS(p.titel,p.datum,p.notiz);}));
  m.querySelectorAll('[data-brief]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const b=JSON.parse(el.dataset.brief);
    const u=unitById(b.id); if(!u) return;
    if(b.kind==='erh') textDialog('Mieterhöhung: '+u.e.bezeichnung, briefErhoehung(u.o,u.e));
    else textDialog('Zahlungserinnerung: '+u.e.bezeichnung, briefMahnung(u.o,u.e));
  }));
}

/* ========== Daten laden ========== */
function viewNoData(){
  return `<h2>Willkommen im Immobilien-Cockpit</h2>
  <p class="sub">Es sind noch keine Daten geladen. Die Objektdaten liegen aus Datenschutzgründen nicht auf GitHub, sondern bei dir lokal.</p>
  <div class="drop" id="drop">Datei <b>immobilien-daten.json</b> hierher ziehen<br>oder klicken zum Auswählen
  <input type="file" id="fileIn" accept=".json" style="display:none"></div>
  <p class="note" style="margin-top:14px">Die Daten werden anschließend im Browser gespeichert (localStorage) – sie verlassen deinen Rechner nicht.</p>`;
}
function wireNoData(){
  const drop=document.getElementById('drop'), fi=document.getElementById('fileIn');
  drop.addEventListener('click',()=>fi.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');loadDataFile(e.dataTransfer.files[0]);});
  fi.addEventListener('change',()=>loadDataFile(fi.files[0]));
}
function loadDataFile(f){
  if(!f) return;
  f.text().then(t=>{
    try{ const j=JSON.parse(t); if(!j.objekte) throw 0; DATA=j; store.set('ic_data',j); render(); }
    catch(e){ alert('Datei konnte nicht gelesen werden – ist es die richtige immobilien-daten.json?'); }
  });
}

  </div>
  ${alerts.length?`<div class="card"><h3>Handlungsbedarf</h3>${alerts.map(a=>`<div class="alert${a.bad?'':' warn'}"><b>${esc(a.o.name)}:</b> ${esc(a.n)}</div>`).join('')}</div>`:''}

function importBankFile(f){
  if(!f) return;
  f.arrayBuffer().then(buf=>{
    let text = new TextDecoder('utf-8',{fatal:false}).decode(buf);
    if(text.includes('�')) text = new TextDecoder('windows-1252').decode(buf);
    let items=[];
    if(/^\s*<\?xml|<Document/i.test(text)) items = parseCAMT(text);
    else items = parseCSV(text);

function payKey(p){ return [p.datum,p.betrag,norm(p.name).slice(0,20),norm(p.zweck).slice(0,30)].join('|'); }
/* Miet-Monat aus dem Verwendungszweck ableiten ("Miete Juli", "07/2026"), sonst Buchungsmonat.
   Nur akzeptieren, wenn der erkannte Monat max. 2 Monate vom Buchungsdatum abweicht (schützt vor alten Dauerauftragstexten). */
function detectPeriod(zweck, datum){
  const fallback=datum.slice(0,7);
  const MON={januar:1,februar:2,maerz:3,'märz':3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};
  const base=new Date(datum); const by=base.getFullYear(), bm=base.getMonth()+1;
  const z=norm(zweck||'');
  let m=null,y=null,pos=1e9;
  for(const name in MON){
    const i=z.indexOf(name);
    if(i>=0 && i<pos){ pos=i; m=MON[name]; const ym=z.match(new RegExp(name+'\\s*(20\\d{2})')); y=ym?+ym[1]:null; }
  }
  if(m==null){
    // nur echtes "MM/JJ(JJ)" mit Schrägstrich im Original-Zweck (nicht normalisiert, sonst wird "8,90 EUR" zu "8 90")
    const mm=String(zweck||'').toLowerCase().match(/(?:^|[^0-9])(0?[1-9]|1[0-2])\s*\/\s*(20\d{2}|\d{2})(?:[^0-9]|$)/);
    if(mm){ m=+mm[1]; y=mm[2].length===4?+mm[2]:2000+ +mm[2]; if(y<2020||y>2040) y=null; }
  }
  if(m==null) return fallback;
  const cands=y!=null?[y]:[by-1,by,by+1];
  let best=null,bd=99;
  for(const cy of cands){ const diff=Math.abs((cy*12+m)-(by*12+bm)); if(diff<bd){bd=diff;best=cy;} }
  if(bd>2) return fallback;
  return best+'-'+String(m).padStart(2,'0');
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const delim=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===delim&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;};
  const trans = s => norm(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  const head=split(lines[0]).map(h=>trans(h));
  // Schlüssel in Prioritätsreihenfolge suchen: Pass 0 = exakter Spaltenname, Pass 1 = enthält; exclude verhindert Fehltreffer
  const findCol=(keys,exclude)=>{
    for(const pass of [0,1]){
      for(const k of keys){
        const i=head.findIndex(h=>(pass===0?h===k:h.includes(k))&&!(exclude||[]).some(x=>h.includes(x)));
        if(i>=0) return i;
      }
    }
    return -1;
  };
  const ci={
    datum: findCol(['buchungstag','buchungsdatum','valutadatum','wertstellung','datum']),
    name: findCol(['sender','name zahlungsbeteiligter','beguenstigter zahlungspflichtiger','beguenstigter','zahlungspflichtiger','auftraggeber','name']),
    name2: findCol(['empfaenger']),
    iban: findCol(['iban zahlungsbeteiligter','iban auftraggeberkonto','kontonummer iban','iban'],['kontoinhaber']),
    zweck: findCol(['verwendungszweck','buchungstext','umsatztext']),
    betrag: findCol(['betrag','umsatz in eur','umsatz'],['umsatzart'])
  };
  if(ci.datum<0||ci.betrag<0) return [];
  const out=[];
  for(let i=1;i<lines.length;i++){
    const c=split(lines[i]); if(c.length<3) continue;
    const rawD=(c[ci.datum]||'').trim();
    let dm=rawD.match(/(\d{2})\.(\d{2})\.(\d{2,4})/);
    let datum=null;
    if(dm){ let y=dm[3].length===2?'20'+dm[3]:dm[3]; datum=`${y}-${dm[2]}-${dm[1]}`; }
    else { dm=rawD.match(/(\d{4})-(\d{2})-(\d{2})/); if(dm) datum=dm[0]; }
    if(!datum) continue;
    let b=(c[ci.betrag]||'').replace(/\s|€/g,'');
    if(/,\d{1,2}$/.test(b)) b=b.replace(/\./g,'').replace(',','.');
    const betrag=parseFloat(b);
    if(isNaN(betrag)) continue;
    const name=((c[ci.name]||'').trim()) || ((ci.name2>=0?c[ci.name2]:'')||'').trim();
    const p={datum, betrag, name, iban:(ci.iban>=0?(c[ci.iban]||''):'').replace(/\s/g,'').toUpperCase(), zweck:(c[ci.zweck]||'').trim()};
    p.monat=detectPeriod(p.zweck, datum);
    p.key=payKey(p); out.push(p);
  }
  return out;
}
function parseCAMT(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const out=[];
  doc.querySelectorAll('Ntry').forEach(n=>{
    const g=s=>n.querySelector(s)?.textContent?.trim()||'';
    const cdt = g('CdtDbtInd')==='CRDT';
    const amt = parseFloat(g('Amt'));
    const datum = g('BookgDt Dt')||g('ValDt Dt');
    const dtl = n.querySelector('NtryDtls TxDtls');
    const gd = s=>dtl?.querySelector(s)?.textContent?.trim()||'';
    const p={datum, betrag: cdt?amt:-amt, name: gd('RltdPties Dbtr Nm')||gd('Dbtr Nm'), iban: (gd('DbtrAcct Id IBAN')||'').toUpperCase(), zweck: [...(dtl?.querySelectorAll('RmtInf Ustrd')||[])].map(x=>x.textContent).join(' ')};
    if(p.datum && !isNaN(p.betrag)){ p.monat=detectPeriod(p.zweck, p.datum); p.key=payKey(p); out.push(p); }
  });
  return out;
}
function matchPayment(p){
  if(ASSIGN['key:'+p.key]) return ASSIGN['key:'+p.key];
  if(p.iban && ASSIGN['iban:'+p.iban]) return ASSIGN['iban:'+p.iban];
  if(p.name && ASSIGN['name:'+norm(p.name)]) return ASSIGN['name:'+norm(p.name)];
  const units=allUnits();
  // Eigene Überträge (Specht/Waschkowski-Konten) nie automatisch als Miete zuordnen
  if(/specht|waschkowski/i.test(p.name||'')) return null;
  // 1) IBAN aus Stammdaten
  if(p.iban){ const hit=units.find(({e})=>e.iban && e.iban.replace(/\s/g,'')===p.iban); if(hit) return hit.e.id; }
  // 2) Nachname des Mieters in Absendername oder Verwendungszweck (keine reinen Zahlen-Tokens wie Jahreszahlen)
  const hayTokens=new Set(norm(p.name+' '+p.zweck).split(' '));
  const stop=['familie','herr','frau','miete','mieter'];
  let best=null, bestScore=0, tie=false;
  for(const {e} of units){
    if(!e.mieter) continue;
    const tokens=norm(e.mieter).split(' ').filter(t=>t.length>3 && !/^\d+$/.test(t) && !stop.includes(t));
    const score=tokens.filter(t=>hayTokens.has(t)).length;
    if(score>0){
      if(score>bestScore){ best=e.id; bestScore=score; tie=false; }
      else if(score===bestScore && best!==e.id){ tie=true; }
    }
  }
  if(best && !tie) return best;
  if(best && tie) return null;
  // 3) exakter Warmmieten-Betrag (eindeutig) – nur wenn der Zweck nach Miete aussieht
  if(/miete|kaltmiete|warmmiete|nk|pacht/i.test(p.zweck||'')){
    const amountHits=units.filter(({e})=>Math.abs(warm(e)-p.betrag)<0.01);
    if(amountHits.length===1) return amountHits[0].e.id;
  }
  return null;
}

      ${['claude-sonnet-4-5','claude-opus-4-5','claude-haiku-4-5'].map(m=>`<option ${SETTINGS.model===m?'selected':''}>${m}</option>`).join('')}
    </select>
    <div class="btnrow"><button class="btn primary" id="cfSave">Speichern</button></div>
    <p class="note" style="margin-top:10px">Key erstellen: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Der Key wird nur im Browser gespeichert und direkt an die Anthropic-API gesendet.</p></div>
  <div class="card"><h3>Daten</h3>
    <div class="btnrow">
      <button class="btn" id="cfLoad">Neue Datendatei laden</button>
      <button class="btn" id="cfExport">Daten exportieren (JSON)</button>
      <button class="btn" id="cfReset" style="color:var(--bad)">Alles zurücksetzen</button>
    </div>
    <input type="file" id="cfFile" accept=".json" style="display:none">
    <p class="note" style="margin-top:10px">Datenstand: ${esc(DATA?.meta?.stand||'–')} · ${DATA?DATA.objekte.length+' Objekte':''} · ${PAYMENTS.length} importierte Umsätze</p></div>
  <div class="card"><h3>Mietspiegel-Referenzwerte (€/m², bearbeitbar)</h3>
    <table><thead><tr><th>Ort</th><th class="num">Vergleichsmiete</th><th class="num">Spanne von</th><th class="num">bis</th><th class="num">Kappung %</th></tr></thead><tbody>
    ${(DATA?.mietspiegel||[]).map((m,i)=>`<tr><td>${esc(m.ort)}</td>
      <td class="num"><input type="number" step="0.1" style="width:80px" data-ms="${i}:wert" value="${m.wert}"></td>
      <td class="num"><input type="number" step="0.1" style="width:80px" data-ms="${i}:s0" value="${m.spanne[0]}"></td>
      <td class="num"><input type="number" step="0.1" style="width:80px" data-ms="${i}:s1" value="${m.spanne[1]}"></td>
      <td class="num"><input type="number" step="5" style="width:70px" data-ms="${i}:kappung" value="${m.kappung}"></td></tr>`).join('')}
    </tbody></table>
    <div class="btnrow"><button class="btn" id="cfMsSave">Referenzwerte speichern</button></div></div>
  <div class="card"><h3>Bankkonten (Zuordnung eingehender Zahlungen)</h3>
    ${(DATA?.meta?.konten||[]).map(k=>`<p class="note" style="margin:4px 0"><b>${esc(k.name)}</b><br><span class="mono">${esc(k.iban)}</span> · ${esc(k.bank)} – ${esc(k.verwendung)}</p>`).join('')||'<p class="note">–</p>'}</div>`;
}
function wireConf(){
  document.getElementById('cfSave').addEventListener('click',()=>{
    SETTINGS.apiKey=document.getElementById('cfKey').value.trim();
    SETTINGS.model=document.getElementById('cfModel').value;
    store.set('ic_settings',SETTINGS); alert('Gespeichert.');
  });
  document.getElementById('cfLoad').addEventListener('click',()=>document.getElementById('cfFile').click());
  document.getElementById('cfFile').addEventListener('change',e=>loadDataFile(e.target.files[0]));
  document.getElementById('cfExport').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='immobilien-daten.json';a.click();
  });
  document.getElementById('cfReset').addEventListener('click',()=>{
    if(confirm('Wirklich alle Daten, Umsätze und Einstellungen aus dem Browser löschen?')){
      ['ic_data','ic_settings','ic_assign','ic_payments'].forEach(k=>store.del(k));
      DATA=null;SETTINGS={apiKey:'',model:'claude-sonnet-4-5'};ASSIGN={};PAYMENTS=[];CHAT=[];render();
    }
  });
  document.getElementById('cfMsSave').addEventListener('click',()=>{
    document.querySelectorAll('[data-ms]').forEach(inp=>{
      const [i,f]=inp.dataset.ms.split(':');const m=DATA.mietspiegel[+i];const v=parseFloat(inp.value);
      if(isNaN(v))return;
      if(f==='wert')m.wert=v; else if(f==='s0')m.spanne[0]=v; else if(f==='s1')m.spanne[1]=v; else if(f==='kappung')m.kappung=v;
    });
    store.set('ic_data',DATA); alert('Referenzwerte gespeichert.'); render();
  });
}

/* ========== ICS-Dialog & Start ========== */
document.addEventListener('DOMContentLoaded',()=>{
  const dlg=document.createElement('dialog');
  dlg.id='icsDlg';
  dlg.innerHTML=`<h3 style="margin:0 0 8px">Erinnerung als .ics</h3>
  <label>Titel</label><input type="text" id="icsT">
  <label>Datum</label><input type="date" id="icsD">
  <label>Notiz</label><textarea id="icsN" rows="3"></textarea>
  <div class="btnrow" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" id="icsCancel">Abbrechen</button>
    <button class="btn primary" id="icsOk">.ics herunterladen</button></div>`;
  document.body.appendChild(dlg);
  const tdlg=document.createElement('dialog');
  tdlg.id='txtDlg'; tdlg.style.width='min(680px,94vw)';
  tdlg.innerHTML=`<h3 id="txtT" style="margin:0 0 10px">Schreiben</h3>
  <textarea id="txtA" rows="20" style="font-size:13px;line-height:1.5"></textarea>
  <div class="btnrow" style="margin-top:12px;justify-content:space-between">
    <span class="note" id="txtHint">Text vor dem Versand prüfen und anpassen.</span>
    <span><button class="btn" id="txtClose">Schließen</button>
    <button class="btn primary" id="txtCopy">📋 Kopieren</button></span></div>`;
  document.body.appendChild(tdlg);
  document.getElementById('txtClose').addEventListener('click',()=>tdlg.close());
  document.getElementById('txtCopy').addEventListener('click',async()=>{
    const ta=document.getElementById('txtA');
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.select(); document.execCommand('copy'); }
    const b=document.getElementById('txtCopy'); b.textContent='✓ Kopiert'; setTimeout(()=>b.textContent='📋 Kopieren',1500);
  });
  document.getElementById('icsCancel').addEventListener('click',()=>dlg.close());
  document.getElementById('icsOk').addEventListener('click',()=>{
    const t=document.getElementById('icsT').value.trim()||'Erinnerung';
    downloadICS(t,document.getElementById('icsD').value,document.getElementById('icsN').value);
    dlg.close();
  });
  render();
});
</script>
